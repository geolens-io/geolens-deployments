apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "geolens.fullname" . }}-api
  labels:
    {{- include "geolens.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "geolens.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "geolens.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- /* codex review on #29: Helm updates the ServiceAccount in place when
             its IRSA / Pod Identity annotations change, but pods keep the
             AWS_ROLE_ARN and token volume the webhook injected at admission.
             Without this checksum a role change silently leaves every pod on
             the old credentials — or on none — until someone restarts them. */}}
        checksum/serviceaccount: {{ include (print $.Template.BasePath "/serviceaccount.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "geolens.serviceAccountName" . | quote }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "geolens.scheduling" .Values.api | trim }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- include "geolens.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "geolens.fullname" . }}-config
            - secretRef:
                name: {{ include "geolens.secretName" . }}
          env:
            {{- /*
              fix(#16 review): skipped when the operator set it in
              api.extraEnv — a duplicate env name breaks strategic-merge
              tooling (keys `env` by `name`) even though the runtime tolerates
              it. Same guard as the titiler and frontend templates.
            */}}
            {{- $apiExtraNames := list }}
            {{- range (.Values.api.extraEnv | default list) }}
            {{- $apiExtraNames = append $apiExtraNames .name }}
            {{- end }}
            # The migrate hook Job owns schema migrations. Boot-time migration
            # in the api entrypoint defaults ON and would race across
            # replicas (compose runs it as a singleton service).
            {{- if not (has "GEOLENS_API_RUN_MIGRATIONS" $apiExtraNames) }}
            - name: GEOLENS_API_RUN_MIGRATIONS
              value: {{ ternary "false" "true" .Values.migrate.enabled | quote }}
            {{- end }}
            {{- if not (has "FORWARDED_ALLOW_IPS" $apiExtraNames) }}
            # fix(#52): uvicorn trusts X-Forwarded-For only from 127.0.0.1, so every
            # client shared the frontend pod's rate-limit buckets (login: 5/min).
            # The edge overwrites the header, as compose relies on (geolens#430).
            - name: FORWARDED_ALLOW_IPS
              value: "*"
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: staging
              mountPath: /app/staging
            {{- include "geolens.backendScratchMounts" . | nindent 12 }}
            {{- with .Values.api.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # fix(#36, #52): all probes are process-only /health/live (images >= 1.18.0).
          # /health also 503s on the optional cache; as readiness a Valkey blip 502'd
          # all of /api. Startup keeps a budget: boot waits on the database.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        {{- include "geolens.stagingVolume" . | nindent 8 }}
        {{- include "geolens.backendScratchVolumes" . | nindent 8 }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
