{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "geolens.fullname" . }}-migrate
  labels:
    {{- include "geolens.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Run before install/upgrade so pods only ever start against a migrated
    # schema. Job specs are immutable — without the delete policy every image
    # bump would fail `helm upgrade` with a "field is immutable" error.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "geolens.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      {{- /* Deliberately NOT serviceAccountName: this Job is a pre-install /
           pre-upgrade hook and runs BEFORE regular resources exist, so a
           chart-created ServiceAccount is not there yet — the Job is rejected
           with "error looking up service account ... not found", creates no
           pod at all, and the hook hangs until the timeout, failing every
           fresh install. Same ordering rule as the DATABASE_URL_OVERRIDE note
           below. It runs under the namespace default ServiceAccount, which is
           what it did before serviceAccount.* existed; migrations reach only
           the database, never object storage, so they need no cloud role. */}}
      restartPolicy: OnFailure
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          # `upgrade heads` (plural) matches the api entrypoint and stays
          # correct should the migration graph ever carry multiple heads.
          command:
            - sh
            - -c
            - uv run --no-dev alembic upgrade heads
          {{- if .Values.secrets.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.existingSecret }}
          {{- end }}
          {{- if or (not .Values.secrets.existingSecret) .Values.api.extraEnv .Values.migrate.extraEnv (.Values.database | default dict).sslMode }}
          env:
            {{- with (.Values.database | default dict).sslMode }}
            # Inlined, not read from the -config ConfigMap: this Job is a
            # pre-install hook and runs before regular resources exist, so it
            # has no envFrom for them (see the DATABASE_URL_OVERRIDE note
            # below). Without this line the api and worker would connect under
            # the configured TLS mode while the migration connection quietly
            # fell back to the application default.
            - name: DATABASE_SSL_MODE
              value: {{ . | quote }}
            {{- end }}
            {{- if not .Values.secrets.existingSecret }}
            # Inlined rather than referencing the chart-managed Secret: as a
            # pre-install hook this Job runs before regular resources exist,
            # so a secretRef would deadlock a fresh install.
            - name: DATABASE_URL_OVERRIDE
              value: {{ required "secrets.databaseUrlOverride is required (or provide secrets.existingSecret)" .Values.secrets.databaseUrlOverride | quote }}
            - name: JWT_SECRET_KEY
              value: {{ required "secrets.jwtSecretKey is required — generate with `openssl rand -hex 32` (or provide secrets.existingSecret)" .Values.secrets.jwtSecretKey | quote }}
            - name: GEOLENS_ADMIN_USERNAME
              value: {{ required "secrets.adminUsername is required (or provide secrets.existingSecret)" .Values.secrets.adminUsername | quote }}
            - name: GEOLENS_ADMIN_PASSWORD
              value: {{ required "secrets.adminPassword is required (or provide secrets.existingSecret)" .Values.secrets.adminPassword | quote }}
            # Required at settings construction even though the override DSN
            # carries the real credentials (see secret.yaml).
            - name: POSTGRES_PASSWORD
              value: "unused-database-url-override-in-use"
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.migrate.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with (.Values.migrate | default dict).extraVolumeMounts }}
          # This Job connects to the same database as the api, so anything the
          # api must MOUNT to reach it — most often a CA bundle for
          # DATABASE_SSL_MODE=verify-full — this Job needs too. Without it the
          # pre-upgrade hook is the one pod that cannot be given the file, and
          # it fails before any api pod rolls.
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
