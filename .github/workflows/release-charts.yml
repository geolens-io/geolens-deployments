# Publish the Helm chart on every version bump that lands on main:
#   1. chart-releaser packages helm/geolens, attaches the .tgz to a GitHub
#      Release (tag geolens-<version>) and updates the gh-pages index.yaml —
#      the classic `helm repo add` install path.
#   2. The same package is pushed OCI to ghcr.io/geolens-io/charts/geolens.
# skip_existing makes re-runs and non-bump helm/ edits no-ops, so this never
# republishes an existing chart version. workflow_dispatch allows publishing
# a version whose bump merged before this workflow existed.
name: release-charts

on:
  push:
    branches: [main]
    paths:
      - "helm/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: helm
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Push chart to GHCR (OCI)
        # chart-releaser's skip_existing only makes the GitHub Release leg a
        # no-op — it still leaves packaged .tgz files behind, and Helm derives
        # the OCI tag from the chart version. Probe the registry first so a
        # rerun or non-bump helm/ edit never re-pushes an existing version.
        run: |
          shopt -s nullglob
          pkgs=(.cr-release-packages/*.tgz)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "no packaged charts — nothing to push"
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
          version=$(awk '/^version:/ {print $2}' helm/geolens/Chart.yaml)
          if helm pull "oci://ghcr.io/${{ github.repository_owner }}/charts/geolens" \
              --version "$version" -d "$(mktemp -d)" >/dev/null 2>&1; then
            echo "geolens-$version already in GHCR — skipping OCI push"
            exit 0
          fi
          for pkg in "${pkgs[@]}"; do
            helm push "$pkg" oci://ghcr.io/${{ github.repository_owner }}/charts
          done
