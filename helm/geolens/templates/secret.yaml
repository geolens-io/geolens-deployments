{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "geolens.secretName" . }}
  labels:
    {{- include "geolens.labels" . | nindent 4 }}
type: Opaque
{{- /*
  `data` with b64enc, NOT `stringData`. stringData is write-only: the API
  server folds it into `data` and drops it from the stored object. So when a
  key stops being rendered — rotating a credential out, dropping
  OPENAI_API_KEY, moving object storage onto IRSA — Helm's three-way merge
  computes the deletion against `stringData`, which no longer exists on the
  live Secret, and the old value SURVIVES the upgrade. Measured: with
  stringData a removed key was still present after `helm upgrade`; with `data`
  it was gone.

  That silence is the dangerous part — an operator who removes a leaked key
  from values.yaml, upgrades, and sees a clean render has not removed it from
  the cluster, and boto3 still prefers those static keys over an attached role.

  One-time caveat: keys already stranded by a pre-0.4.25 install live in
  `data` with no `data` entry in the old manifest to diff against, so this
  change does not retroactively remove them. Delete those once by hand
  (`kubectl patch secret <release>-secrets --type=json -p
  '[{"op":"remove","path":"/data/S3_ACCESS_KEY_ID"}]'`) or delete the Secret
  and re-run `helm upgrade`.
*/}}
data:
  DATABASE_URL_OVERRIDE: {{ required "secrets.databaseUrlOverride is required (or provide secrets.existingSecret)" .Values.secrets.databaseUrlOverride | toString | b64enc | quote }}
  JWT_SECRET_KEY: {{ required "secrets.jwtSecretKey is required — generate with `openssl rand -hex 32` (or provide secrets.existingSecret)" .Values.secrets.jwtSecretKey | toString | b64enc | quote }}
  GEOLENS_ADMIN_USERNAME: {{ required "secrets.adminUsername is required (or provide secrets.existingSecret)" .Values.secrets.adminUsername | toString | b64enc | quote }}
  GEOLENS_ADMIN_PASSWORD: {{ required "secrets.adminPassword is required (or provide secrets.existingSecret)" .Values.secrets.adminPassword | toString | b64enc | quote }}
  # The backend requires POSTGRES_PASSWORD at settings construction even when
  # DATABASE_URL_OVERRIDE carries the real credentials; the assembled
  # POSTGRES_* DSN is never used while the override is set, so a placeholder
  # satisfies it without duplicating the password in two keys.
  POSTGRES_PASSWORD: {{ "unused-database-url-override-in-use" | b64enc | quote }}
  {{- with .Values.secrets.tileSigningSecret }}
  TILE_SIGNING_SECRET: {{ . | toString | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ . | toString | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | toString | b64enc | quote }}
  {{- end }}
  {{- if and (eq .Values.storage.backend "s3") (not .Values.storage.s3AmbientCredentials) }}
  {{- /* With a static key pair the backend hard-requires both at boot when
       STORAGE_PROVIDER=s3, so fail at template time rather than in a crash
       loop. storage.s3AmbientCredentials=true takes the branch below, where
       the keys are omitted entirely and the SDKs resolve the role. */}}
  S3_ACCESS_KEY_ID: {{ required "storage.s3AccessKeyId is required when storage.backend=s3 (set storage.s3AmbientCredentials=true for IRSA / Pod Identity, or provide secrets.existingSecret)" .Values.storage.s3AccessKeyId | toString | b64enc | quote }}
  S3_SECRET_ACCESS_KEY: {{ required "storage.s3SecretAccessKey is required when storage.backend=s3 (set storage.s3AmbientCredentials=true for IRSA / Pod Identity, or provide secrets.existingSecret)" .Values.storage.s3SecretAccessKey | toString | b64enc | quote }}
  {{- else }}
  {{- with .Values.storage.s3AccessKeyId }}
  S3_ACCESS_KEY_ID: {{ . | toString | b64enc | quote }}
  {{- end }}
  {{- with .Values.storage.s3SecretAccessKey }}
  S3_SECRET_ACCESS_KEY: {{ . | toString | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
