apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "geolens.fullname" . }}-config
  labels:
    {{- include "geolens.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.environment | quote }}
  PUBLIC_APP_URL: {{ .Values.api.publicAppUrl | quote }}
  PUBLIC_API_URL: {{ .Values.api.publicApiUrl | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.api.corsAllowedOrigins | quote }}
  UPLOAD_MAX_SIZE_MB: {{ .Values.api.uploadMaxSizeMb | quote }}
  STORAGE_PROVIDER: {{ .Values.storage.backend | quote }}
  {{- with .Values.storage.s3Endpoint }}
  S3_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- with .Values.storage.s3Region }}
  S3_REGION: {{ . | quote }}
  {{- end }}
  {{- /* Same two knobs titiler's GDAL env is derived from — passed here so the
         api/worker and titiler resolve the endpoint identically. */}}
  {{- if .Values.storage.s3AllowHttp }}
  S3_ALLOW_HTTP: "true"
  {{- end }}
  {{- if ne .Values.storage.s3AddressingStyle "auto" }}
  S3_ADDRESSING_STYLE: {{ .Values.storage.s3AddressingStyle | quote }}
  {{- end }}
  {{- if eq .Values.storage.backend "s3" }}
  S3_BUCKET: {{ required "storage.s3Bucket is required when storage.backend=s3" .Values.storage.s3Bucket | quote }}
  {{- else }}
  {{- with .Values.storage.s3Bucket }}
  S3_BUCKET: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.database.sslMode }}
  DATABASE_SSL_MODE: {{ . | quote }}
  {{- end }}
  {{- with .Values.redis.url }}
  REDIS_URL: {{ . | quote }}
  {{- end }}
  {{- if .Values.titiler.enabled }}
  TITILER_BASE_URL: http://{{ include "geolens.fullname" . }}-titiler:8000
  {{- end }}
