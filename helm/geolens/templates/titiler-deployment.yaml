{{- if .Values.titiler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "geolens.fullname" . }}-titiler
  labels:
    {{- include "geolens.labels" . | nindent 4 }}
    app.kubernetes.io/component: titiler
spec:
  replicas: {{ .Values.titiler.replicas }}
  selector:
    matchLabels:
      {{- include "geolens.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: titiler
  template:
    metadata:
      labels:
        {{- include "geolens.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: titiler
      {{- if and (eq .Values.storage.backend "s3") (not .Values.secrets.existingSecret) }}
      annotations:
        # Roll titiler when the chart-managed Secret rotates — its AWS_* env
        # comes from secretKeyRefs read only at container start.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      {{- end }}
    spec:
      # No podSecurityContext: the upstream titiler image declares its own
      # user; the chart's uid 1001 is a backend-image contract.
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: titiler
          image: "{{ .Values.titiler.image.repository }}:{{ .Values.titiler.image.tag }}"
          imagePullPolicy: {{ .Values.titiler.image.pullPolicy }}
          # Parity with the compose titiler service's hardening (cap_drop ALL,
          # no-new-privileges, read_only rootfs + /tmp tmpfs). GDAL scratch
          # goes to /tmp, mounted as an emptyDir below; everything else the
          # process touches is /vsis3/-style virtual I/O or the staging mount.
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          command:
            - uvicorn
            - titiler.application.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --workers
            # geolens#1193: mirrors the compose TITILER_WORKERS knob. Raise
            # titiler.resources memory alongside it — GDAL_CACHEMAX is per
            # process and the geolens#678 RSS ratchet runs in each worker.
            - {{ .Values.titiler.workers | default 1 | quote }}
          ports:
            - name: http
              containerPort: 8000
          env:
            # GDAL raster I/O tuning — mirrors the titiler service in the main
            # repo's docker-compose.yml.
            - name: GDAL_CACHEMAX
              value: "200"
            - name: GDAL_DISABLE_READDIR_ON_OPEN
              value: "EMPTY_DIR"
            - name: CPL_VSIL_CURL_ALLOWED_EXTENSIONS
              value: ".tif,.tiff,.cog,.vrt"
            # geolens#1192: pin the VRT rawband controls (both GDAL >= 3.12)
            # rather than inheriting version-dependent defaults, so a base-image
            # bump cannot relax them silently.
            #
            # ALLOWED_SOURCE previously read "NETWORK_OR_LOCAL", which is not a
            # value GDAL accepts (SIBLING_OR_CHILD_OF_VRT_PATH | ONLY_REMOTE |
            # ALL | <absolute path>). GDAL parsed it as a bogus absolute path
            # and refused every VRTRawRasterBand source, so the effective policy
            # was already deny-all while the name suggested otherwise. Measured
            # in titiler 2.0.5 and 2.2.1, both GDAL 3.12.1.
            #
            # ENABLE_RAWRASTERBAND=NO states that deny-all in a value GDAL
            # accepts, and costs nothing: GeoLens emits no VRTRawRasterBand
            # (gdalbuildvrt writes SimpleSource / ComplexSource), and ordinary
            # SimpleSource VRTs read unchanged under NO.
            - name: GDAL_VRT_ENABLE_RAWRASTERBAND
              value: "NO"
            - name: GDAL_VRT_RAWRASTERBAND_ALLOWED_SOURCE
              value: "SIBLING_OR_CHILD_OF_VRT_PATH"
            # CPL_VSIL_CURL_HEADER_FILE_KVP_ENABLED restricts the /vsicurl
            # header_file option and needs GDAL >= 3.13.2 — deliberately absent
            # until the image's rasterio wheel crosses that (geolens#1192).
            - name: VSI_CACHE
              value: "TRUE"
            - name: CPL_VSIL_CURL_CACHE_SIZE
              value: "16777216"
            - name: GDAL_HTTP_MERGE_CONSECUTIVE_RANGES
              value: "YES"
            # fix(geolens#937): GDAL_HTTP_FOLLOWLOCATION was set here as a
            # redirect clamp. It is not a GDAL option and has no effect, so it
            # read as a defense that was never there. Do not re-add it. GDAL
            # cannot be made redirect-safe from the inside; the real controls
            # are the api revalidating remote object URLs per hop and the
            # CPL_VSIL_CURL_ALLOWED_EXTENSIONS clamp above.
            # geolens#678: cap glibc malloc arenas — slows (does not stop)
            # TiTiler's RSS ratchet under concurrent tile reads. Mirrors the
            # compose TITILER_MALLOC_ARENA_MAX knob and its default.
            - name: MALLOC_ARENA_MAX
              value: {{ .Values.titiler.mallocArenaMax | default 2 | quote }}
            {{- if eq .Values.storage.backend "s3" }}
            # optional: tolerates a pre-created Secret that lacks these exact
            # keys. (The backend itself hard-requires s3 credentials, so an
            # ambient-credential-only setup cannot boot the api anyway.)
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "geolens.secretName" . }}
                  key: S3_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "geolens.secretName" . }}
                  key: S3_SECRET_ACCESS_KEY
                  optional: true
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.storage.s3Region | default "us-east-1" | quote }}
            {{- /*
              Custom-endpoint plumbing for GDAL's /vsis3/ reads (geolens#579).
              titiler runs no GeoLens code, so the api/worker's boot-time
              derive_gdal_s3_env() cannot reach it — the same rules are applied
              here instead, from the same storage.* values the api receives:
                - GDAL wants a scheme-LESS host[:port]; the scheme becomes
                  AWS_HTTPS. An explicit scheme on s3Endpoint wins, otherwise
                  s3AllowHttp decides.
                - AWS_VIRTUAL_HOSTING=FALSE only for path-style addressing.

              Every derived key is skipped when the operator already set it in
              titiler.extraEnv. Emitting both would repeat an env name, and
              while the container runtime just takes the later value, strategic
              -merge tooling keys `env` by `name` — so Helm/Argo upgrades can
              fail on the duplicate merge key before a pod ever rolls. Anyone
              who followed the old workaround note must be able to upgrade.
            */}}
            {{- $extraNames := list }}
            {{- range (.Values.titiler.extraEnv | default list) }}
            {{- $extraNames = append $extraNames .name }}
            {{- end }}
            {{- $ep := trim (.Values.storage.s3Endpoint | default "") }}
            {{- if $ep }}
            {{- $hasScheme := contains "://" $ep }}
            {{- $scheme := $hasScheme | ternary (splitList "://" $ep | first) "" }}
            {{- $host := ($hasScheme | ternary (splitList "://" $ep | last) $ep) | splitList "/" | first }}
            {{- if $host }}
            {{- if not (has "AWS_S3_ENDPOINT" $extraNames) }}
            - name: AWS_S3_ENDPOINT
              value: {{ $host | quote }}
            {{- end }}
            {{- if and ($hasScheme | ternary (eq $scheme "http") .Values.storage.s3AllowHttp) (not (has "AWS_HTTPS" $extraNames)) }}
            - name: AWS_HTTPS
              value: "NO"
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if and (eq .Values.storage.s3AddressingStyle "path") (not (has "AWS_VIRTUAL_HOSTING" $extraNames)) }}
            - name: AWS_VIRTUAL_HOSTING
              value: "FALSE"
            {{- end }}
            {{- end }}
            {{- with .Values.titiler.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            # titiler reads rasters under the shared staging path (GAP-022).
            - name: staging
              mountPath: /app/staging
            # Writable scratch for GDAL under the read-only rootfs; size
            # mirrors the compose tmpfs (/tmp:size=128m).
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.titiler.resources | nindent 12 }}
      volumes:
        {{- include "geolens.stagingVolume" . | nindent 8 }}
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
{{- end }}
