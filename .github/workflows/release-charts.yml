# Publish the Helm chart on every version bump that lands on main:
#   1. chart-releaser packages helm/geolens, attaches the .tgz to a GitHub
#      Release (tag geolens-<version>) and updates the gh-pages index.yaml —
#      the classic `helm repo add` install path.
#   2. The same package is pushed OCI to ghcr.io/geolens-io/charts/geolens and
#      signed keylessly with cosign.
# #53: it runs only after chart-ci passes on a push to main, from the commit
# chart-ci tested, so a red main never publishes. skip_existing and the
# registry probe keep re-runs and merges without a version bump from
# republishing an existing chart version; the OCI leg still signs this
# commit's version if an earlier run stopped before signing it.
# workflow_dispatch allows publishing a version whose bump merged before this
# workflow existed.
name: release-charts

on:
  workflow_run:
    workflows: [chart-ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  # cosign keyless signing: Fulcio issues the certificate from the job's OIDC token.
  id-token: write

concurrency:
  group: release-charts
  cancel-in-progress: false

jobs:
  release:
    # workflow_run also fires for chart-ci on pull requests, including a fork's
    # branch named main. Only a green push to this repository may publish.
    # codex review on #53: a manual run must be on main too, or its signing
    # identity names another ref and the README's verify command rejects it.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      # The commit chart-ci tested. The `if` above admits only pushes to this
      # repository's main, and the next step re-checks it; main's current HEAD
      # could be a newer commit whose CI has not passed.
      # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Refuse anything not on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::$(git rev-parse HEAD) is not on main; not publishing it"
            exit 1
          }

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: helm
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Push chart to GHCR (OCI) and sign it
        id: oci
        # Helm derives the OCI tag from the chart version, so probe the registry
        # first and a rerun or non-bump merge never re-pushes an existing version.
        # #53: sign the digest helm reports, never a tag, so the signature
        # covers exactly the bytes in the registry. #57: every run checks this
        # commit's version, not only a chart chart-releaser just packaged, so
        # the next green push finishes a release that stopped before signing.
        env:
          CHARTS: ghcr.io/${{ github.repository_owner }}/charts
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(awk '/^version:/ {print $2}' helm/geolens/Chart.yaml)
          # chart-releaser packages only charts changed since the last tag.
          pkg=.cr-release-packages/geolens-$version.tgz
          if [ ! -f "$pkg" ]; then
            helm package helm/geolens -d "$RUNNER_TEMP/pkg" > /dev/null
            pkg=$RUNNER_TEMP/pkg/geolens-$version.tgz
          fi
          echo "$TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # #57: cosign reads Docker's credential store, not helm's. A store
          # local to this step keeps the next step's verify anonymous.
          export DOCKER_CONFIG="$RUNNER_TEMP/docker"
          echo "$TOKEN" | cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          identity="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release-charts.yml@refs/heads/main"
          pulled=$(mktemp -d)
          if out=$(helm pull "oci://$CHARTS/geolens" --version "$version" -d "$pulled" 2>&1); then
            # codex review on #53: a run that pushed but died before signing
            # leaves this version unsigned. Sign it only if its files match
            # this commit's (helm 3 tarballs differ by mtime).
            digest=$(sed -n 's/^Digest: //p' <<<"$out")
            if [ -z "$digest" ]; then
              echo "::error::helm pull reported no digest for geolens-$version"
              exit 1
            fi
            if cosign verify "$CHARTS/geolens@$digest" --certificate-identity "$identity" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null 2>&1; then
              echo "geolens-$version is already in GHCR and signed"
            else
              mkdir "$pulled/registry" "$pulled/commit"
              tar -xzf "$pulled/geolens-$version.tgz" -C "$pulled/registry"
              tar -xzf "$pkg" -C "$pulled/commit"
              if ! diff -rq "$pulled/registry" "$pulled/commit"; then
                echo "::error::geolens-$version in GHCR is unsigned and differs from the chart this commit packages; not signing it"
                exit 1
              fi
              echo "geolens-$version is in GHCR unsigned and matches this commit's chart; signing it"
              cosign sign --yes "$CHARTS/geolens@$digest"
            fi
          elif grep -q ': not found$' <<<"$out"; then
            out=$(helm push "$pkg" "oci://$CHARTS" 2>&1)
            echo "$out"
            digest=$(sed -n 's/^Digest: //p' <<<"$out")
            if [ -z "$digest" ]; then
              echo "::error::helm push reported no digest for $pkg; refusing to publish it unsigned"
              exit 1
            fi
            cosign sign --yes "$CHARTS/geolens@$digest"
          else
            # #57: push only a version GHCR reports missing; any other pull
            # failure could otherwise move a published tag to new bytes.
            echo "::error::cannot tell whether geolens-$version is in GHCR: $out"
            exit 1
          fi
          echo "signed=$version" >> "$GITHUB_OUTPUT"

      - name: Verify anonymous OCI pull and signature
        # GHCR creates new packages PRIVATE by default and only public packages
        # allow anonymous pulls — the README advertises an unauthenticated
        # install. Fail loudly (rather than silently shipping a broken install
        # path) until an org admin flips the one-time visibility setting.
        env:
          CHARTS: ghcr.io/${{ github.repository_owner }}/charts
          SIGNED: ${{ steps.oci.outputs.signed }}
        run: |
          helm registry logout ghcr.io || true
          version=$(awk '/^version:/ {print $2}' helm/geolens/Chart.yaml)
          if ! helm pull "oci://$CHARTS/geolens" \
              --version "$version" -d "$(mktemp -d)"; then
            echo "::error::$CHARTS/geolens is not anonymously pullable." \
                 "One-time fix: org settings -> Packages -> charts/geolens -> Change visibility -> Public, then re-run this job."
            exit 1
          fi
          # The same check the README gives operators, run anonymously.
          if [ -n "$SIGNED" ]; then
            cosign verify "$CHARTS/geolens:$SIGNED" \
              --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release-charts.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            echo "geolens-$SIGNED is signed by this workflow on main"
          fi
