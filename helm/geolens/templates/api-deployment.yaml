apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "geolens.fullname" . }}-api
  labels:
    {{- include "geolens.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "geolens.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "geolens.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- /* The IRSA / Pod Identity webhook injects AWS_ROLE_ARN and a token volume
             only at admission, so a ServiceAccount annotation change must roll the
             pods, or they keep the old credentials (or none) until restarted. */}}
        checksum/serviceaccount: {{ include (print $.Template.BasePath "/serviceaccount.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "geolens.serviceAccountName" . | quote }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "geolens.scheduling" .Values.api | trim }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- include "geolens.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "geolens.fullname" . }}-config
            - secretRef:
                name: {{ include "geolens.secretName" . }}
          env:
            {{- /* Each entry below is skipped when api.extraEnv sets the same name:
                 duplicate env names break strategic-merge tooling, which keys `env`
                 by `name`. The frontend and titiler templates use the same guard. */}}
            {{- $apiExtraNames := list }}
            {{- range (.Values.api.extraEnv | default list) }}
            {{- $apiExtraNames = append $apiExtraNames .name }}
            {{- end }}
            # The migrate hook Job owns schema migrations. Boot-time migration
            # in the api entrypoint defaults ON and would race across
            # replicas (compose runs it as a singleton service).
            {{- if not (has "GEOLENS_API_RUN_MIGRATIONS" $apiExtraNames) }}
            - name: GEOLENS_API_RUN_MIGRATIONS
              value: {{ ternary "false" "true" .Values.migrate.enabled | quote }}
            {{- end }}
            {{- if not (has "FORWARDED_ALLOW_IPS" $apiExtraNames) }}
            # uvicorn trusts X-Forwarded-For only from 127.0.0.1, so every client
            # would share the frontend pod's rate-limit buckets (login: 5/min).
            # The edge overwrites the header, which compose relies on too.
            - name: FORWARDED_ALLOW_IPS
              value: "*"
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: staging
              mountPath: /app/staging
            {{- include "geolens.backendScratch" (list .Values.api.extraVolumeMounts .Values.extraVolumes "mounts") | trim | nindent 12 }}
            {{- with .Values.api.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Every probe is the process-only /health/live (images >= 1.18.0): /health
          # also fails on the optional cache, so a Valkey blip would 502 all of /api.
          # Startup keeps a budget because boot waits on the database.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        {{- include "geolens.stagingVolume" . | nindent 8 }}
        {{- include "geolens.backendScratch" (list .Values.api.extraVolumeMounts .Values.extraVolumes "volumes") | trim | nindent 8 }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
