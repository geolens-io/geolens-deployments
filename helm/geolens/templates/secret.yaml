{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "geolens.secretName" . }}
  labels:
    {{- include "geolens.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL_OVERRIDE: {{ required "secrets.databaseUrlOverride is required (or provide secrets.existingSecret)" .Values.secrets.databaseUrlOverride | quote }}
  JWT_SECRET_KEY: {{ required "secrets.jwtSecretKey is required — generate with `openssl rand -hex 32` (or provide secrets.existingSecret)" .Values.secrets.jwtSecretKey | quote }}
  GEOLENS_ADMIN_USERNAME: {{ required "secrets.adminUsername is required (or provide secrets.existingSecret)" .Values.secrets.adminUsername | quote }}
  GEOLENS_ADMIN_PASSWORD: {{ required "secrets.adminPassword is required (or provide secrets.existingSecret)" .Values.secrets.adminPassword | quote }}
  # The backend requires POSTGRES_PASSWORD at settings construction even when
  # DATABASE_URL_OVERRIDE carries the real credentials; the assembled
  # POSTGRES_* DSN is never used while the override is set, so a placeholder
  # satisfies it without duplicating the password in two keys.
  POSTGRES_PASSWORD: "unused-database-url-override-in-use"
  {{- with .Values.secrets.tileSigningSecret }}
  TILE_SIGNING_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- if eq .Values.storage.backend "s3" }}
  {{- /* The backend hard-requires both at boot when STORAGE_PROVIDER=s3 —
       there is no ambient-credential fallback — so fail at template time. */}}
  S3_ACCESS_KEY_ID: {{ required "storage.s3AccessKeyId is required when storage.backend=s3 (or provide secrets.existingSecret)" .Values.storage.s3AccessKeyId | quote }}
  S3_SECRET_ACCESS_KEY: {{ required "storage.s3SecretAccessKey is required when storage.backend=s3 (or provide secrets.existingSecret)" .Values.storage.s3SecretAccessKey | quote }}
  {{- else }}
  {{- with .Values.storage.s3AccessKeyId }}
  S3_ACCESS_KEY_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.storage.s3SecretAccessKey }}
  S3_SECRET_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
