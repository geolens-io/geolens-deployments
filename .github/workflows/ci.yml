name: chart-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# GitHub's default `bash -e` leaves pipefail off, so a guard that pipes into
# `grep -q` could pass or fail on SIGPIPE timing alone.
defaults:
  run:
    shell: bash

jobs:
  lint-and-template:
    name: lint-and-template (helm ${{ matrix.major }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Pinned rather than whatever the runner image ships, and both majors,
        # since operators use both. Dependabot does not bump these inputs; move
        # them by hand. main requires these checks by name, so the name carries
        # only the major and a bump renames nothing.
        include:
          - {major: 3, helm: v3.22.0}
          - {major: 4, helm: v4.3.0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm }}

      - name: helm lint
        # Lint mode does not enforce `required` (this step passed with empty
        # values), but linting with the same values as the template matrix
        # keeps it representative of a real install.
        run: |
          helm lint helm/geolens \
            --set secrets.databaseUrlOverride='postgresql+asyncpg://geolens:pw@db.internal:5432/geolens' \
            --set secrets.jwtSecretKey='0123456789abcdef0123456789abcdef' \
            --set secrets.adminUsername='admin' \
            --set secrets.adminPassword='chart-ci-only-Passw0rd!'

      - name: Template — default configuration
        run: |
          helm template geolens helm/geolens \
            --set secrets.databaseUrlOverride='postgresql+asyncpg://geolens:pw@db.internal:5432/geolens' \
            --set secrets.jwtSecretKey='0123456789abcdef0123456789abcdef' \
            --set secrets.adminUsername='admin' \
            --set secrets.adminPassword='chart-ci-only-Passw0rd!' \
            > /dev/null

      - name: Template — existingSecret + ingress + staging persistence
        run: |
          helm template geolens helm/geolens \
            --set secrets.existingSecret=geolens-secrets \
            --set ingress.enabled=true \
            --set staging.persistence.enabled=true \
            > /dev/null

      - name: Template — titiler disabled, s3 storage
        run: |
          helm template geolens helm/geolens \
            --set secrets.existingSecret=geolens-secrets \
            --set titiler.enabled=false \
            --set storage.backend=s3 \
            --set storage.s3Bucket=geolens \
            > /dev/null

      - name: Guard - Titiler selects one S3 credential source
        # The default credential reference must stay byte-compatible with
        # existing installs, and a dedicated read-only Secret must replace, not
        # accompany, the shared storage credential.
        run: |
          credential_ref() {
            env_name="$1"
            awk -v want="$env_name" '
              $1 == "-" && $2 == "name:" && $3 == want { in_env=1; next }
              in_env && $1 == "name:" {
                secret=$2
                gsub(/^"|"$/, "", secret)
                next
              }
              in_env && $1 == "key:" {
                key=$2
                gsub(/^"|"$/, "", key)
                print secret "|" key
                exit
              }
            '
          }

          fallback=$(helm template geolens helm/geolens \
            --set secrets.existingSecret=geolens-secrets \
            --set storage.backend=s3 \
            --set storage.s3Bucket=geolens \
            --show-only templates/titiler-deployment.yaml)
          fallback_access=$(credential_ref AWS_ACCESS_KEY_ID <<<"$fallback")
          fallback_secret=$(credential_ref AWS_SECRET_ACCESS_KEY <<<"$fallback")
          if [ "$fallback_access" != "geolens-secrets|S3_ACCESS_KEY_ID" ] || \
             [ "$fallback_secret" != "geolens-secrets|S3_SECRET_ACCESS_KEY" ]; then
            echo "Titiler shared-credential fallback drifted: access=$fallback_access secret=$fallback_secret" >&2
            exit 1
          fi

          legacy=$(helm template geolens helm/geolens \
            --set secrets.existingSecret=geolens-secrets \
            --set storage.backend=s3 \
            --set storage.s3Bucket=geolens \
            --set-json 'titiler.s3Credentials=null' \
            --show-only templates/titiler-deployment.yaml)
          legacy_access=$(credential_ref AWS_ACCESS_KEY_ID <<<"$legacy")
          legacy_secret=$(credential_ref AWS_SECRET_ACCESS_KEY <<<"$legacy")
          if [ "$legacy_access" != "$fallback_access" ] || [ "$legacy_secret" != "$fallback_secret" ]; then
            echo "Titiler legacy --reuse-values fallback drifted: access=$legacy_access secret=$legacy_secret" >&2
            exit 1
          fi

          dedicated=$(helm template geolens helm/geolens \
            --set secrets.existingSecret=geolens-secrets \
            --set storage.backend=s3 \
            --set storage.s3Bucket=geolens \
            --set titiler.s3Credentials.existingSecret=geolens-titiler-readonly \
            --set titiler.s3Credentials.accessKeyIdKey=readonly-access-id \
            --set titiler.s3Credentials.secretAccessKeyKey=readonly-secret \
            --show-only templates/titiler-deployment.yaml)
          dedicated_access=$(credential_ref AWS_ACCESS_KEY_ID <<<"$dedicated")
          dedicated_secret=$(credential_ref AWS_SECRET_ACCESS_KEY <<<"$dedicated")
          if [ "$dedicated_access" != "geolens-titiler-readonly|readonly-access-id" ] || \
             [ "$dedicated_secret" != "geolens-titiler-readonly|readonly-secret" ]; then
            echo "Titiler dedicated credential did not win: access=$dedicated_access secret=$dedicated_secret" >&2
            exit 1
          fi
          if grep -q 'name: geolens-secrets' <<<"$dedicated"; then
            echo "Titiler still carries the shared storage Secret alongside its dedicated credential" >&2
            exit 1
          fi
          if grep -q 'checksum/secret:' <<<"$dedicated"; then
            echo "Titiler checksums a chart-managed Secret it does not consume" >&2
            exit 1
          fi
          if [ "$(grep -c 'name: AWS_ACCESS_KEY_ID' <<<"$dedicated")" -ne 1 ] || \
             [ "$(grep -c 'name: AWS_SECRET_ACCESS_KEY' <<<"$dedicated")" -ne 1 ]; then
            echo "Titiler rendered duplicate AWS credential env entries" >&2
            exit 1
          fi

          # Secret names and keys are strings even when their
          # spelling looks like a YAML boolean, null, or number. Keep the
          # rendered scalars quoted so Kubernetes receives valid string fields.
          scalar_like=$(helm template geolens helm/geolens \
            --set secrets.existingSecret=geolens-secrets \
            --set storage.backend=s3 \
            --set storage.s3Bucket=geolens \
            --set-string titiler.s3Credentials.existingSecret=yes \
            --set-string titiler.s3Credentials.accessKeyIdKey=123 \
            --set-string titiler.s3Credentials.secretAccessKeyKey=null \
            --show-only templates/titiler-deployment.yaml)
          if [ "$(grep -c 'name: "yes"' <<<"$scalar_like")" -ne 2 ] || \
             [ "$(grep -c 'key: "123"' <<<"$scalar_like")" -ne 1 ] || \
             [ "$(grep -c 'key: "null"' <<<"$scalar_like")" -ne 1 ]; then
            echo "Titiler Secret selectors must stay quoted YAML strings" >&2
            exit 1
          fi
          echo "Titiler credential fallback and dedicated replacement both render correctly"

      - name: Guard - the migrate hook never references a chart-created ServiceAccount
        # The migrate Job is a pre-install/pre-upgrade hook: it runs BEFORE
        # regular resources exist. Naming the chart's own ServiceAccount there
        # makes the API server reject the pod ("error looking up service
        # account ... not found"), so the Job creates NO pod, the hook hangs to
        # its timeout, and EVERY fresh install fails. Caught on a real cluster;
        # rendering alone looks perfectly valid, which is why this is a guard.
        run: |
          migrate=$(helm template geolens helm/geolens \
            --set secrets.existingSecret=geolens-secrets \
            --show-only templates/migrate-job.yaml)
          if grep -q 'serviceAccountName' <<<"$migrate"; then
            echo "migrate-job.yaml sets serviceAccountName; a pre-install hook cannot reference a resource the release has not created yet" >&2
            exit 1
          fi
          # ...while the ordinary workloads must still get it.
          for tpl in api-deployment worker-deployment titiler-deployment; do
            sa=$(helm template geolens helm/geolens \
              --set secrets.existingSecret=geolens-secrets \
              --show-only "templates/$tpl.yaml")
            if ! grep -q 'serviceAccountName' <<<"$sa"; then
              echo "$tpl lost its serviceAccountName; IRSA / Pod Identity has nowhere to attach" >&2
              exit 1
            fi
          done
          echo "migrate hook is SA-free; api/worker/titiler carry the ServiceAccount"

      - name: Guard - the Secret uses data, so removed keys are actually removed
        # stringData is write-only: the API server folds it into `data` and
        # drops it, so Helm's three-way merge computes deletions against a
        # field the live object no longer has and a removed credential SURVIVES
        # the upgrade. Measured: with stringData a removed key was still
        # present after `helm upgrade`; with `data` it was gone. An operator
        # rotating out a leaked key would see a clean render and a live secret.
        run: |
          rendered=$(helm template geolens helm/geolens \
            --set secrets.databaseUrlOverride='postgresql+asyncpg://u:p@db:5432/g' \
            --set secrets.jwtSecretKey='0123456789abcdef0123456789abcdef' \
            --set secrets.adminUsername=admin \
            --set secrets.adminPassword='chart-ci-only-Passw0rd!' \
            --show-only templates/secret.yaml)
          if grep -q '^stringData:' <<<"$rendered"; then
            echo "secret.yaml renders stringData; removed keys would survive helm upgrade" >&2
            exit 1
          fi
          grep -q '^data:' <<<"$rendered" || { echo "secret.yaml renders neither data nor stringData" >&2; exit 1; }
          # Values must survive the base64 round-trip byte-for-byte.
          got=$(grep -E '^  JWT_SECRET_KEY:' <<<"$rendered" | sed 's/.*: //; s/"//g' | base64 -d)
          [ "$got" = "0123456789abcdef0123456789abcdef" ] || { echo "base64 round-trip altered a value: $got" >&2; exit 1; }
          echo "Secret renders base64 data and round-trips exactly"

      - name: Guard - ambient S3 credentials render no static keys
        # storage.s3AmbientCredentials=true must drop the key pair entirely: a
        # leftover key WINS over the attached role in both boto3 and GDAL, so a
        # half-applied switch silently keeps using the long-lived credential.
        run: |
          rendered=$(helm template geolens helm/geolens \
            --set secrets.databaseUrlOverride='postgresql+asyncpg://u:p@db:5432/g' \
            --set secrets.jwtSecretKey='0123456789abcdef0123456789abcdef' \
            --set secrets.adminUsername=admin \
            --set secrets.adminPassword='chart-ci-only-Passw0rd!' \
            --set storage.backend=s3 --set storage.s3Bucket=geolens \
            --set storage.s3AmbientCredentials=true \
            --show-only templates/secret.yaml)
          if grep -qE '^  S3_(ACCESS_KEY_ID|SECRET_ACCESS_KEY):' <<<"$rendered"; then
            echo "ambient credentials still rendered a static S3 key into the Secret" >&2
            exit 1
          fi
          # And the static path must still fail closed without keys.
          if helm template geolens helm/geolens \
            --set secrets.databaseUrlOverride='postgresql+asyncpg://u:p@db:5432/g' \
            --set secrets.jwtSecretKey='0123456789abcdef0123456789abcdef' \
            --set secrets.adminUsername=admin \
            --set secrets.adminPassword='chart-ci-only-Passw0rd!' \
            --set storage.backend=s3 --set storage.s3Bucket=geolens \
            > /dev/null 2>&1; then
            echo "storage.backend=s3 without keys and without s3AmbientCredentials must still fail" >&2
            exit 1
          fi
          echo "ambient credentials omit static keys; the static path still fails closed"

      - name: Guard - renders when a cross-version --reuse-values omits newer values
        # `helm upgrade --reuse-values` coalesces the OLD release's values
        # against the new chart, so a release installed from 0.4.24 or earlier
        # supplies NO top-level serviceAccount or database map. Dereferencing
        # .Values.database.sslMode then aborts rendering with a nil pointer and
        # the upgrade fails before anything rolls. Every new parent map must be
        # `| default dict`-guarded, the way titiler.s3Credentials already is.
        # The upgrade step in this workflow cannot catch it: it reuses values
        # from a release installed with this same chart.
        run: |
          helm template geolens helm/geolens \
            --set secrets.existingSecret=geolens-secrets \
            --set-json 'serviceAccount=null' \
            --set-json 'database=null' \
            > /dev/null || {
              echo "rendering failed with the new top-level maps absent; a --reuse-values upgrade from an older chart would fail here" >&2
              exit 1
            }
          # A scalar the backend validates needs its default in the template too:
          # an empty S3_ADDRESSING_STYLE fails boot.
          style=$(helm template geolens helm/geolens \
            --set secrets.existingSecret=geolens-secrets \
            --set-json 'storage.s3AddressingStyle=null' \
            --show-only templates/configmap.yaml)
          if grep -q S3_ADDRESSING_STYLE <<<"$style"; then
            echo "an absent storage.s3AddressingStyle renders S3_ADDRESSING_STYLE, which the backend rejects unless it is auto, path or virtual" >&2
            exit 1
          fi
          echo "renders with serviceAccount, database and s3AddressingStyle absent (cross-version --reuse-values safe)"

      - name: Guard - a --reuse-values upgrade from the published chart keeps pods non-root
        # --reuse-values renders the new templates against
        # the previous release's values, so values added since are absent. Render
        # exactly that, against the latest published chart's values.yaml, and
        # require the non-root pod defaults Pod Security "restricted" admits.
        run: |
          chart=$(mktemp -d)/geolens
          cp -R helm/geolens "$chart"
          helm show values oci://ghcr.io/geolens-io/charts/geolens > "$chart/values.yaml"
          render() {
            helm template geolens "$chart" --set secrets.existingSecret=geolens-secrets \
              --show-only "templates/$1.yaml"
          }
          for want in titiler-deployment:1001 frontend-deployment:101; do
            tpl=${want%%:*}
            uid=${want##*:}
            rendered=$(render "$tpl")
            pod=$(awk '/^    spec:/{f=1} f && /^      securityContext:/{p=1; next} p && /^      [a-z]/{exit} p' <<<"$rendered")
            if ! grep -q 'runAsNonRoot: true' <<<"$pod" || ! grep -q "runAsUser: $uid\$" <<<"$pod"; then
              echo "$tpl lost its non-root pod securityContext under the published chart's values:" >&2
              echo "$pod" >&2
              exit 1
            fi
          done
          # The read-only roots and the PDBs must survive the same upgrade.
          all=$(helm template geolens "$chart" --set secrets.existingSecret=geolens-secrets)
          containers=$(grep -cE '^        - name: (api|worker|frontend|titiler|migrate)$' <<<"$all")
          readonly=$(grep -c 'readOnlyRootFilesystem: true' <<<"$all")
          pdbs=$(grep -c '^kind: PodDisruptionBudget$' <<<"$all")
          if [ "$readonly" -ne "$containers" ] || [ "$pdbs" -ne 3 ]; then
            echo "under the published chart's values: $readonly of $containers containers read-only, $pdbs PodDisruptionBudgets (want all, and 3)" >&2
            exit 1
          fi
          echo "reused published values still render titiler as uid 1001, the frontend as uid 101, every container read-only and 3 PDBs"

      - name: Guard - NetworkPolicies render only when enabled, and only the frontend and titiler reach the api
        # The policies are opt-in, and the api's is what keeps other pods
        # from routing around the edge or forging X-Forwarded-For.
        run: |
          count() { grep -c '^kind: NetworkPolicy$' || true; }
          render() { helm template geolens helm/geolens --set secrets.existingSecret=geolens-secrets "$@"; }
          [ "$(render | count)" -eq 0 ] || { echo "NetworkPolicies rendered while disabled" >&2; exit 1; }
          [ "$(render --set networkPolicy.enabled=true | count)" -eq 3 ] || { echo "want api, titiler and worker policies" >&2; exit 1; }
          [ "$(render --set networkPolicy.enabled=true --set titiler.enabled=false | count)" -eq 2 ] || { echo "a titiler policy rendered without titiler" >&2; exit 1; }
          [ "$(render --set networkPolicy.enabled=true --set-json 'networkPolicy.frontendFrom=[{"podSelector":{}}]' | count)" -eq 4 ] || { echo "frontendFrom did not add the frontend policy" >&2; exit 1; }
          api=$(render --set networkPolicy.enabled=true | awk 'BEGIN{RS="---"} /kind: NetworkPolicy/ && index($0, "name: geolens-api\n")')
          if ! grep -q 'app.kubernetes.io/component: frontend' <<<"$api" || ! grep -q 'app.kubernetes.io/component: titiler' <<<"$api" || grep -q 'namespaceSelector' <<<"$api"; then
            echo "the api policy must admit only this release's frontend and titiler pods" >&2
            exit 1
          fi
          api=$(render --set networkPolicy.enabled=true --set titiler.enabled=false | awk 'BEGIN{RS="---"} /kind: NetworkPolicy/ && index($0, "name: geolens-api\n")')
          if grep -q 'app.kubernetes.io/component: titiler' <<<"$api"; then
            echo "the api policy admitted titiler pods with titiler disabled" >&2
            exit 1
          fi
          relay=$(render)
          grep -q 'REMOTE_RASTER_RELAY_BASE_URL: http://geolens-api:8000$' <<<"$relay" || {
            echo "the api and worker must find the relay at the api Service" >&2
            exit 1
          }
          echo "policies render only when enabled; the api admits only the frontend and titiler"

      - name: Guard - PodDisruptionBudgets keep an explicit maxUnavailable
        # 0 is how an operator blocks voluntary evictions, and a `default`
        # fallback would silently turn it into 1.
        run: |
          render() { helm template geolens helm/geolens --set secrets.existingSecret=geolens-secrets "$@"; }
          [ "$(render | grep -c '^  maxUnavailable: 1$')" -eq 3 ] || { echo "want three PDBs at maxUnavailable 1 by default" >&2; exit 1; }
          [ "$(render --set podDisruptionBudget.maxUnavailable=0 | grep -c '^  maxUnavailable: 0$')" -eq 3 ] || {
            echo "podDisruptionBudget.maxUnavailable=0 did not render as 0" >&2
            exit 1
          }
          echo "PDBs default to maxUnavailable 1 and keep an explicit 0"

      - name: Guard - placement reaches its pods, and the migrate hook takes the api's node placement
        # A hook left off a tainted node pool stays Pending and times out the
        # install, so the api's tolerations must reach it too, but never its pod
        # affinity or spread, which select api pods.
        run: |
          cat > "$RUNNER_TEMP/placement.yaml" <<'EOF'
          api:
            tolerations:
              - {key: pool, operator: Equal, value: geolens, effect: NoSchedule}
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions: [{key: node-pool, operator: In, values: [geolens]}]
              podAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 1
                    podAffinityTerm: {topologyKey: kubernetes.io/hostname, labelSelector: {matchLabels: {app.kubernetes.io/component: api}}}
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 1
                    podAffinityTerm: {topologyKey: kubernetes.io/hostname, labelSelector: {matchLabels: {app.kubernetes.io/component: api}}}
            topologySpreadConstraints:
              - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/component: api}}}
          worker:
            nodeSelector: {pool: big}
          EOF
          rendered=$(helm template geolens helm/geolens --set secrets.existingSecret=geolens-secrets -f "$RUNNER_TEMP/placement.yaml")
          doc() { awk -v want="$1" 'BEGIN{RS="---"} index($0, "name: " want "\n") && /kind: (Deployment|Job)/'; }
          api=$(doc geolens-api <<<"$rendered")
          migrate=$(doc geolens-migrate <<<"$rendered")
          for want in tolerations: nodeAffinity: podAffinity: podAntiAffinity: topologySpreadConstraints:; do
            grep -q "$want" <<<"$api" || { echo "the api lost its $want" >&2; exit 1; }
          done
          for want in tolerations: nodeAffinity:; do
            grep -q "$want" <<<"$migrate" || { echo "the migrate hook lost the api's $want" >&2; exit 1; }
          done
          if grep -qE 'podAffinity:|podAntiAffinity:|topologySpreadConstraints:' <<<"$migrate"; then
            echo "the migrate hook took the api's pod affinity or spread; a pre-install hook runs before any api pod exists" >&2
            exit 1
          fi
          worker=$(doc geolens-worker <<<"$rendered")
          grep -q 'pool: big' <<<"$worker" || { echo "worker nodeSelector did not render" >&2; exit 1; }
          frontend=$(doc geolens-frontend <<<"$rendered")
          if grep -qE 'tolerations:|nodeSelector:|affinity:' <<<"$frontend"; then
            echo "another component's placement leaked into the frontend" >&2
            exit 1
          fi
          echo "placement renders per component; the migrate hook takes only the api's node placement"

      - name: Guard - operator volumes never collide with the backend scratch volumes
        # An extraVolumes entry named like a chart volume,
        # or a component mount at /tmp or /home/appuser, must not duplicate a
        # volume name or mountPath. Admission rejects that; a render does not.
        # A name the chart cannot give way on fails the render instead.
        run: |
          check() {
            rendered=$(cat)
            for name in geolens-api geolens-worker geolens-migrate; do
              pod=$(awk -v want="$name" 'BEGIN{RS="---"} index($0, "name: " want "\n") && /kind: (Deployment|Job)/' <<<"$rendered")
              dupes=$(awk '/^      volumes:/ {v=1; next} v && /^      [a-z]/ {v=0} v && /^        - name: / {print $3}' <<<"$pod" | sort | uniq -d)
              if [ -n "$dupes" ]; then echo "$1: $name repeats volume names: $dupes" >&2; exit 1; fi
              for p in /tmp /home/appuser; do
                n=$(grep -c "mountPath: $p$" <<<"$pod" || true)
                if [ "$n" -ne 1 ]; then echo "$1: $name mounts $p $n times, want 1" >&2; exit 1; fi
              done
            done
          }
          render() { helm template geolens helm/geolens --set secrets.existingSecret=geolens-secrets "$@"; }
          render | check defaults
          render --set-json 'extraVolumes=[{"name":"tmp","emptyDir":{}},{"name":"home","emptyDir":{}}]' \
            --set-json 'api.extraVolumeMounts=[{"name":"tmp","mountPath":"/tmp"}]' \
            --set-json 'worker.extraVolumeMounts=[{"name":"home","mountPath":"/home/appuser"}]' \
            --set-json 'migrate.extraVolumeMounts=[{"name":"tmp","mountPath":"/tmp"},{"name":"home","mountPath":"/home/appuser"}]' \
            | check overrides
          # An operator volume named like a chart scratch volume but mounted
          # elsewhere must fail the render, not reach admission.
          if out=$(render --set-json 'extraVolumes=[{"name":"geolens-tmp","emptyDir":{}}]' \
              --set-json 'api.extraVolumeMounts=[{"name":"geolens-tmp","mountPath":"/data"}]' 2>&1); then
            echo "an extraVolumes entry named geolens-tmp rendered beside the chart's own" >&2
            exit 1
          fi
          grep -q 'rename that volume' <<<"$out" || { echo "failed for another reason: $out" >&2; exit 1; }
          # Mounted at /tmp wherever it renders, the same name is the operator's scratch.
          render --set-json 'extraVolumes=[{"name":"geolens-tmp","emptyDir":{}}]' \
            --set-json 'api.extraVolumeMounts=[{"name":"geolens-tmp","mountPath":"/tmp"}]' \
            --set-json 'worker.extraVolumeMounts=[{"name":"geolens-tmp","mountPath":"/tmp"}]' \
            | check reused-name
          echo "backend pods mount /tmp and /home/appuser once each, under unique volume names"

      - name: Guard - database.sslMode reaches the migrate hook too
        # The migrate Job cannot read the chart ConfigMap (hook ordering), so a
        # mode configured only there would leave migrations on the application
        # default while api and worker used the configured one.
        run: |
          for tpl in configmap migrate-job; do
            mode=$(helm template geolens helm/geolens \
              --set secrets.existingSecret=geolens-secrets \
              --set database.sslMode=verify-full \
              --show-only "templates/$tpl.yaml")
            if ! grep -q 'DATABASE_SSL_MODE' <<<"$mode"; then
              echo "database.sslMode did not reach $tpl" >&2
              exit 1
            fi
          done
          echo "database.sslMode reaches both the ConfigMap and the migrate hook"

      - name: Guard - no no-op GDAL_HTTP_FOLLOWLOCATION in rendered output
        # The variable is not a GDAL option and does nothing, so setting it reads
        # as a redirect defense that is not there. GDAL cannot be made
        # redirect-safe from the inside; the controls are the api revalidating
        # remote object URLs per hop and titiler's CPL_VSIL_CURL_ALLOWED_EXTENSIONS
        # clamp. The main repo pins the same in backend/tests/test_titiler_redirect_env.py.
        run: |
          rendered=$(helm template geolens helm/geolens \
            --set secrets.existingSecret=geolens-secrets)
          if grep -q 'name: GDAL_HTTP_FOLLOWLOCATION' <<<"$rendered"; then
            echo "GDAL_HTTP_FOLLOWLOCATION is not a GDAL option and provides no redirect protection (geolens#937); remove it" >&2
            exit 1
          fi

      - name: Required-value guards fail an empty install
        run: |
          if helm template geolens helm/geolens > /dev/null 2>&1; then
            echo "expected 'required' failure when no secrets are provided" >&2
            exit 1
          fi

      - name: Guard - GDAL_VRT_RAWRASTERBAND_ALLOWED_SOURCE is a value GDAL accepts
        # GDAL accepts four forms (SIBLING_OR_CHILD_OF_VRT_PATH | ONLY_REMOTE |
        # ALL | <absolute path>) and parses anything else as an absolute path
        # that refuses every VRTRawRasterBand source, so a plausible-looking value
        # can silently mean the opposite. The check fails on any unrecognised
        # token rather than passing it.
        run: |
          value=$(helm template geolens helm/geolens \
            --set secrets.existingSecret=geolens-secrets \
            | grep -A1 'name: GDAL_VRT_RAWRASTERBAND_ALLOWED_SOURCE' \
            | sed -n 's/.*value: "\(.*\)"/\1/p' | head -1)
          if [ -z "$value" ]; then
            echo "GDAL_VRT_RAWRASTERBAND_ALLOWED_SOURCE is not rendered at all; pin it explicitly (geolens#1192)" >&2
            exit 1
          fi
          case "$value" in
            SIBLING_OR_CHILD_OF_VRT_PATH|ONLY_REMOTE|ALL|/*) ;;
            *)
              echo "GDAL_VRT_RAWRASTERBAND_ALLOWED_SOURCE='$value' is not a value GDAL accepts; it will be parsed as an absolute path and refuse every source (geolens#1192)" >&2
              exit 1
              ;;
          esac
          echo "GDAL_VRT_RAWRASTERBAND_ALLOWED_SOURCE=$value is accepted by GDAL"

      - name: Guard - extraEnv overrides never render duplicate env names
        # An operator overriding a chart-default env var via
        # extraEnv (e.g. opting back into raw-band VRTs) must yield exactly one
        # entry with that name. The runtime tolerates duplicates but
        # strategic-merge tooling keys `env` by `name`, so an Argo/Helm upgrade
        # can fail on the duplicate merge key before a pod rolls — wedging the
        # very upgrade that applies the override. Checks every container in
        # every rendered manifest, not just the overridden one, so a NEW
        # unguarded static entry in any template fails here the day it
        # collides.
        run: |
          rendered=$(helm template geolens helm/geolens \
            --set secrets.existingSecret=geolens-secrets \
            --set storage.backend=s3 --set storage.s3Bucket=geolens \
            --set-json 'titiler.extraEnv=[{"name":"GDAL_VRT_ENABLE_RAWRASTERBAND","value":"YES"},{"name":"MALLOC_ARENA_MAX","value":"4"}]' \
            --set-json 'frontend.extraEnv=[{"name":"API_BASE_URL","value":"https://geo.example.com"}]' \
            --set-json 'api.extraEnv=[{"name":"GEOLENS_API_RUN_MIGRATIONS","value":"true"},{"name":"DATABASE_SSL_CA_CERT","value":"/etc/ssl/db/ca.pem"},{"name":"FORWARDED_ALLOW_IPS","value":"10.42.0.0/16"}]' \
            --set-json 'migrate.extraEnv=[{"name":"DATABASE_SSL_CA_CERT","value":"/etc/ssl/db/ca.pem"}]')
          # Without existingSecret the migrate hook inlines its credentials, and
          # each of those must give way to an operator entry too.
          inlined=$(helm template geolens helm/geolens \
            --set secrets.databaseUrlOverride='postgresql+asyncpg://g:p@db/g' \
            --set secrets.jwtSecretKey=0123456789abcdef0123456789abcdef \
            --set secrets.adminUsername=admin --set secrets.adminPassword='chart-ci-only-Passw0rd!' \
            --set-json 'api.extraEnv=[{"name":"DATABASE_URL_OVERRIDE","valueFrom":{"secretKeyRef":{"name":"db","key":"dsn"}}},{"name":"JWT_SECRET_KEY","valueFrom":{"secretKeyRef":{"name":"jwt","key":"key"}}}]' \
            --set-json 'migrate.extraEnv=[{"name":"GEOLENS_ADMIN_USERNAME","value":"root"},{"name":"GEOLENS_ADMIN_PASSWORD","value":"other-Passw0rd!"},{"name":"POSTGRES_PASSWORD","value":"x"}]')
          rendered=$(printf '%s\n---\n%s\n' "$rendered" "$inlined")
          # The migrate Job renders api.extraEnv AND migrate.extraEnv, so the
          # same name set in both would land twice in one container.
          # A name may legitimately appear once per CONTAINER, so scope the
          # count per container: container list entries (lowercase names at
          # 8-space indent) and document separators both reset the seen-set;
          # env entries are ALL-CAPS at deeper indent and never match the
          # container pattern.
          fail=0
          printf '%s\n' "$rendered" | awk '
            /^---$/ { delete seen }
            /^ {8}- name: [a-z]/ { delete seen }
            /^ +- name: [A-Z_0-9]+$/ {
              if (seen[$3]++) { print "duplicate env name in one container: " $3; bad=1 }
            }
            END { exit bad }
          ' || fail=1
          if [ "$fail" -ne 0 ]; then
            echo "extraEnv override rendered a duplicate env name (see above); guard the static entry with the \$extraNames check" >&2
            exit 1
          fi
          # The override must also WIN: the operator value, not the default.
          got=$(printf '%s\n' "$rendered" | grep -A1 'name: GDAL_VRT_ENABLE_RAWRASTERBAND' \
            | sed -n 's/.*value: "\(.*\)"/\1/p' | head -1)
          if [ "$got" != "YES" ]; then
            echo "extraEnv override did not take effect: GDAL_VRT_ENABLE_RAWRASTERBAND='$got', expected 'YES'" >&2
            exit 1
          fi
          echo "extraEnv overrides render uniquely and win"

      - name: Guard - api probes match the image's health endpoints
        # /health fails during a database outage and on the optional cache, so
        # as liveness it would restart every api pod in a loop, as readiness a
        # Valkey outage would 502 all of /api, and as the startup probe it would
        # crash-loop any pod that started during one. Readiness may use
        # /health/ready only on an image that ships it; older images answer 404.
        run: |
          probe_path() {
            printf '%s\n' "$2" | awk -v p="$1:" '$1 == p {f=1} f && /path:/{print $2; exit}'
          }
          render() {
            helm template geolens helm/geolens \
              --set secrets.existingSecret=geolens-secrets "$@" \
              --show-only templates/api-deployment.yaml
          }
          check() {
            want=$1; shift
            api=$(render "$@")
            for probe in startupProbe livenessProbe; do
              got=$(probe_path "$probe" "$api")
              [ "$got" = "/health/live" ] || { echo "api $probe path is '$got'; must be /health/live" >&2; exit 1; }
            done
            got=$(probe_path readinessProbe "$api")
            [ "$got" = "$want" ] || { echo "api readinessProbe path is '$got' for '$*'; want $want" >&2; exit 1; }
          }
          check /health/ready
          check /health/ready --set api.image.tag=v1.21.0
          check /health/live --set api.image.tag=1.20.0
          check /health/live --set api.image.tag=latest
          check /health/live --set api.image.tag=1.24.0-rc1
          echo "api readiness uses /health/ready only on images that ship it; startup and liveness stay /health/live"

      - name: Guard - the api trusts the X-Forwarded-For the edge writes
        # uvicorn trusts forwarded headers only from 127.0.0.1 by default, so
        # every client would share the frontend pod's rate-limit buckets and five
        # failed logins from anyone would lock out everyone. An operator override
        # must replace the default, not duplicate it.
        run: |
          api=$(helm template geolens helm/geolens \
            --set secrets.existingSecret=geolens-secrets \
            --show-only templates/api-deployment.yaml)
          if [ "$(grep -A1 'name: FORWARDED_ALLOW_IPS$' <<<"$api" | grep -c 'value: "\*"')" -ne 1 ]; then
            echo "the api container must set FORWARDED_ALLOW_IPS=\"*\" exactly once" >&2
            exit 1
          fi
          narrowed=$(helm template geolens helm/geolens \
            --set secrets.existingSecret=geolens-secrets \
            --set-json 'api.extraEnv=[{"name":"FORWARDED_ALLOW_IPS","value":"10.42.0.0/16"}]' \
            --show-only templates/api-deployment.yaml)
          if [ "$(grep -c 'name: FORWARDED_ALLOW_IPS$' <<<"$narrowed")" -ne 1 ] || \
             ! grep -A1 'name: FORWARDED_ALLOW_IPS$' <<<"$narrowed" | grep -q '10.42.0.0/16'; then
            echo "an api.extraEnv FORWARDED_ALLOW_IPS must replace the chart default" >&2
            exit 1
          fi
          echo "the api trusts the edge's X-Forwarded-For; an extraEnv override replaces it"

      - name: Guard - stored-secret encryption keys are threaded and validated
        # Both keys reach the Secret AND the migrate hook,
        # a previous key without a current one fails at template time, and so
        # does a key against an api image too old to read it.
        run: |
          base="--set secrets.databaseUrlOverride=postgresql+asyncpg://g:p@db/g --set secrets.jwtSecretKey=0123456789abcdef0123456789abcdef --set secrets.adminUsername=admin --set secrets.adminPassword=chart-ci-only-Passw0rd!"
          both="--set api.image.tag=1.18.2 --set worker.image.tag=1.18.2"
          rendered=$(helm template geolens helm/geolens $base $both \
            --set secrets.secretEncryptionKey=new-key --set secrets.secretEncryptionKeyPrevious=old-key)
          secret=$(awk '/^kind: Secret$/{f=1} f && /^---$/{exit} f' <<<"$rendered")
          for k in SECRET_ENCRYPTION_KEY SECRET_ENCRYPTION_KEY_PREVIOUS; do
            grep -q "^  $k:" <<<"$secret" || { echo "$k missing from the Secret" >&2; exit 1; }
          done
          migrate=$(helm template geolens helm/geolens $base $both \
            --set secrets.secretEncryptionKey=new-key --set secrets.secretEncryptionKeyPrevious=old-key \
            --show-only templates/migrate-job.yaml)
          for k in SECRET_ENCRYPTION_KEY SECRET_ENCRYPTION_KEY_PREVIOUS; do
            grep -q "name: $k$" <<<"$migrate" || { echo "$k missing from the migrate hook" >&2; exit 1; }
          done
          if helm template geolens helm/geolens $base $both \
               --set secrets.secretEncryptionKeyPrevious=old-key >/dev/null 2>&1; then
            echo "a previous key without a current key rendered; the backend would refuse to boot" >&2
            exit 1
          fi
          if helm template geolens helm/geolens $base --set api.image.tag=1.18.1 --set worker.image.tag=1.18.1 \
               --set secrets.secretEncryptionKey=new-key >/dev/null 2>&1; then
            echo "secretEncryptionKey rendered against api 1.18.1, which silently ignores it" >&2
            exit 1
          fi
          # The worker reads the same Secret: a new api with an old worker
          # would encrypt with a key the worker does not know.
          if helm template geolens helm/geolens $base --set api.image.tag=1.18.2 --set worker.image.tag=1.18.1 \
               --set secrets.secretEncryptionKey=new-key >/dev/null 2>&1; then
            echo "secretEncryptionKey rendered with worker 1.18.1 behind api 1.18.2" >&2
            exit 1
          fi
          # An install that already carried the key through extraEnv must not
          # get it twice in the migrate container when it adopts the value.
          overridden=$(helm template geolens helm/geolens $base $both \
            --set secrets.secretEncryptionKey=new-key \
            --set-json 'api.extraEnv=[{"name":"SECRET_ENCRYPTION_KEY","value":"from-extra-env"}]' \
            --show-only templates/migrate-job.yaml)
          n=$(printf '%s\n' "$overridden" | grep -c 'name: SECRET_ENCRYPTION_KEY$')
          if [ "$n" -ne 1 ] || ! grep -Eq 'value: "?from-extra-env"?' <<<"$overridden"; then
            echo "SECRET_ENCRYPTION_KEY rendered $n times in the migrate hook, or the extraEnv value did not win" >&2
            exit 1
          fi
          echo "encryption keys threaded, invalid combinations rejected, extraEnv override wins once"

      - name: Guard - the migrate hook reads its credentials from a hook Secret, never a plain value
        # A plain `value:` in the Job spec is readable by anyone with the built-in
        # view role, and a failed Job keeps it. The hook Secret must be a hook too
        # (the chart Secret does not exist before a pre-install hook) with a lower
        # weight, because Helm breaks equal weights by name and the Job sorts first.
        run: |
          rendered=$(helm template geolens helm/geolens \
            --set secrets.databaseUrlOverride='postgresql+asyncpg://u:guard-dsn-pw@db:5432/g' \
            --set secrets.jwtSecretKey='guard-jwt-0123456789abcdef0123456789' \
            --set secrets.adminUsername=guard-admin \
            --set secrets.adminPassword='guard-admin-Passw0rd!' \
            --set secrets.secretEncryptionKey=guard-enc-new \
            --set secrets.secretEncryptionKeyPrevious=guard-enc-old)
          job=$(awk 'BEGIN{RS="---"} /kind: Job/' <<<"$rendered")
          hook=$(awk 'BEGIN{RS="---"} /kind: Secret/ && index($0, "name: geolens-migrate-secrets\n")' <<<"$rendered")
          for k in DATABASE_URL_OVERRIDE JWT_SECRET_KEY GEOLENS_ADMIN_USERNAME GEOLENS_ADMIN_PASSWORD \
                   POSTGRES_PASSWORD SECRET_ENCRYPTION_KEY SECRET_ENCRYPTION_KEY_PREVIOUS; do
            if [ "$(grep -c -- "- name: $k$" <<<"$job")" -ne 1 ]; then
              echo "$k is not set exactly once in the migrate hook" >&2
              exit 1
            fi
            if ! grep -A1 -- "- name: $k$" <<<"$job" | grep -q 'valueFrom:'; then
              echo "$k renders as a plain value in the migrate hook" >&2
              exit 1
            fi
            grep -q "^  $k:" <<<"$hook" || { echo "$k missing from the migrate hook Secret" >&2; exit 1; }
          done
          for v in guard-dsn-pw guard-jwt guard-admin-Passw0rd guard-enc-new guard-enc-old; do
            if grep -q "$v" <<<"$job"; then
              echo "a supplied credential ($v) appears in the migrate Job spec" >&2
              exit 1
            fi
          done
          refs=$(grep -A2 'secretKeyRef:' <<<"$job" | awk '$1 == "name:" {print $2}' | sort -u)
          [ "$refs" = "geolens-migrate-secrets" ] || { echo "the migrate hook reads a Secret other than its own hook Secret: $refs" >&2; exit 1; }
          grep -q '"helm.sh/hook": pre-install,pre-upgrade' <<<"$hook" || { echo "the migrate hook Secret is not a pre-install,pre-upgrade hook" >&2; exit 1; }
          grep -q '"helm.sh/hook-weight": "-1"' <<<"$hook" || { echo "the migrate hook Secret lost the weight that orders it before the Job" >&2; exit 1; }
          if grep -q 'helm.sh/hook-weight' <<<"$job"; then
            echo "the migrate Job now carries a hook weight; re-check that its Secret still sorts first" >&2
            exit 1
          fi
          if grep -q '^stringData:' <<<"$hook"; then
            echo "the migrate hook Secret renders stringData" >&2
            exit 1
          fi
          # existingSecret installs need no hook Secret: the Job reads the operator's Secret.
          existing=$(helm template geolens helm/geolens --set secrets.existingSecret=geolens-secrets)
          if grep -q 'name: geolens-migrate-secrets' <<<"$existing"; then
            echo "the migrate hook Secret rendered alongside secrets.existingSecret" >&2
            exit 1
          fi
          echo "migrate hook credentials come only from its own pre-install hook Secret"

      - name: Guard - a password-bearing redis.url stays out of the ConfigMap when the chart Secret renders
        # ConfigMaps are readable by the built-in view role. With
        # secrets.existingSecret the URL stays in the ConfigMap, so those
        # upgrades keep rendering; a REDIS_URL key in that Secret wins there.
        run: |
          url='rediss://:guard-valkey-pw@cache:6379/0'
          rendered=$(helm template geolens helm/geolens \
            --set secrets.databaseUrlOverride='postgresql+asyncpg://u:p@db:5432/g' \
            --set secrets.jwtSecretKey='0123456789abcdef0123456789abcdef' \
            --set secrets.adminUsername=admin \
            --set secrets.adminPassword='chart-ci-only-Passw0rd!' \
            --set redis.url="$url")
          config=$(awk 'BEGIN{RS="---"} /kind: ConfigMap/' <<<"$rendered")
          secret=$(awk 'BEGIN{RS="---"} /kind: Secret/ && index($0, "name: geolens-secrets\n")' <<<"$rendered")
          if grep -q 'guard-valkey-pw\|REDIS_URL' <<<"$config"; then
            echo "redis.url rendered into the ConfigMap while the chart Secret renders" >&2
            exit 1
          fi
          got=$(grep -E '^  REDIS_URL:' <<<"$secret" | sed 's/.*: //; s/"//g' | base64 -d)
          [ "$got" = "$url" ] || { echo "REDIS_URL missing from the chart Secret or altered: $got" >&2; exit 1; }
          existing=$(helm template geolens helm/geolens --set secrets.existingSecret=geolens-secrets \
            --set redis.url="$url" --show-only templates/configmap.yaml)
          grep -q "REDIS_URL: \"$url\"" <<<"$existing" || {
            echo "secrets.existingSecret with redis.url no longer renders REDIS_URL; those installs would lose their cache on upgrade" >&2
            exit 1
          }
          echo "REDIS_URL lives in the chart Secret; existingSecret installs keep it in the ConfigMap"

  # Real install against a kind cluster: exercises the install-time failure
  # classes static rendering provably cannot catch (hook ordering, Job
  # immutability on upgrade, probe budgets, FQDN proxy resolution through the
  # frontend edge, Pod Security admission). Uses the published GHCR images at
  # the chart's default tags.
  install-test:
    name: kind install test (helm ${{ matrix.major }})
    runs-on: ubuntu-latest
    needs: lint-and-template
    timeout-minutes: 45
    env:
      # curlimages/curl:8.10.1
      CURL_IMAGE: curlimages/curl@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
    strategy:
      fail-fast: false
      matrix:
        include:
          - {major: 3, helm: v3.22.0}
          - {major: 4, helm: v4.3.0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm }}

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          # No CNI until Calico is applied below, so the node is not Ready yet.
          config: .github/ci/kind-calico.yaml
          wait: 0s

      - name: Install Calico
        # See kind-calico.yaml for why not kindnet. Images come from quay.io.
        # The manifest is fetched at the commit tag v3.32.2 points to, since a
        # tag can move.
        run: |
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/db255c554b929afd73552fd3ac81d691107a1607/manifests/calico.yaml
          kubectl -n kube-system rollout status ds/calico-node --timeout=300s
          kubectl -n kube-system rollout status deploy/coredns --timeout=300s

      - name: Deploy CI PostgreSQL (PostGIS + pgvector)
        run: |
          kubectl apply -f .github/ci/postgres.yaml
          kubectl rollout status deployment/geolens-ci-db --timeout=300s

      - name: Diagnose CI PostgreSQL rollout failure
        # geolens-ci-db has no app.kubernetes.io/instance=geolens
        # label, so the job-level Diagnostics step below never sees it; name
        # the failure here instead of leaving a bare rollout timeout.
        if: failure()
        run: |
          kubectl get pods -l app=geolens-ci-db -o wide
          kubectl describe pods -l app=geolens-ci-db
          kubectl logs -l app=geolens-ci-db --all-containers --tail=200 --prefix

      - name: helm install --wait
        # Into a namespace that enforces Pod Security "restricted", so a pod spec
        # that renders cleanly but that admission rejects fails here rather than
        # on an operator's hardened cluster. The NetworkPolicies are on and
        # staging uses a shared claim (kind's single node serves ReadWriteOnce to
        # every pod), so the steps below can ingest.
        run: |
          kubectl create namespace geolens
          kubectl label namespace geolens pod-security.kubernetes.io/enforce=restricted
          helm install geolens helm/geolens --namespace geolens \
            --set api.replicas=1 \
            --set frontend.replicas=1 \
            --set secrets.databaseUrlOverride='postgresql+asyncpg://geolens:chart-ci-db-password@geolens-ci-db.default.svc.cluster.local:5432/geolens' \
            --set secrets.jwtSecretKey='0123456789abcdef0123456789abcdef' \
            --set secrets.adminUsername='ci-admin' \
            --set secrets.adminPassword='chart-ci-only-Passw0rd!' \
            --set networkPolicy.enabled=true \
            --set staging.persistence.enabled=true \
            --set-json 'staging.persistence.accessModes=["ReadWriteOnce"]' \
            --set staging.persistence.storageClass=standard \
            --wait --timeout 20m

      - name: NOTES warn when no shared volume carries the staging handoff
        # Only s3 hands an upload to the worker through the bucket, so
        # local and azure without staging.persistence fail every import. Helm
        # 3 renders NOTES only in a dry run, and that one needs a cluster.
        run: |
          notes() {
            helm install notes-check helm/geolens --namespace default --dry-run=client \
              --set secrets.existingSecret=geolens-secrets "$@" | sed -n '/^NOTES:/,$p'
          }
          for backend in local azure; do
            out=$(notes --set "storage.backend=$backend")
            if ! grep -q "WARNING: storage.backend=$backend without staging.persistence" <<<"$out"; then
              echo "no staging warning for storage.backend=$backend" >&2
              exit 1
            fi
            out=$(notes --set "storage.backend=$backend" --set staging.persistence.enabled=true)
            if grep -q 'without staging.persistence' <<<"$out"; then
              echo "staging warning shown for storage.backend=$backend with staging.persistence on" >&2
              exit 1
            fi
          done
          out=$(notes --set storage.backend=s3 --set storage.s3Bucket=geolens)
          if grep -q 'without staging.persistence' <<<"$out"; then
            echo "staging warning shown for storage.backend=s3" >&2
            exit 1
          fi
          echo "NOTES warn exactly when a backend other than s3 has no shared staging volume"

      - name: Smoke through the frontend edge
        # Validates the whole chain the chart configures: frontend nginx ->
        # resolver -> api Service FQDN -> /api prefix strip -> backend /health.
        run: |
          kubectl run smoke --image="$CURL_IMAGE" --restart=Never \
            --attach --rm --command -- \
            curl -sf --retry 5 --retry-delay 3 http://geolens-frontend.geolens/api/health

      - name: Ingest through the frontend edge
        # The data path a render cannot prove. The api hands an upload to
        # the worker through /app/staging, both under read-only roots, and
        # titiler serves the ingested raster through the api's tile proxy,
        # which the NetworkPolicies must still allow.
        run: |
          kubectl -n geolens port-forward svc/geolens-frontend 8080:80 > port-forward.log 2>&1 &
          for _ in $(seq 1 20); do grep -q Forwarding port-forward.log && break; sleep 1; done
          .github/ci/ingest-smoke.sh http://127.0.0.1:8080 ci-admin 'chart-ci-only-Passw0rd!'

      - name: NetworkPolicy keeps other pods off the api, titiler and worker
        run: |
          kubectl run np-probe --image="$CURL_IMAGE" --restart=Never --command -- sleep 600
          kubectl wait --for=condition=Ready pod/np-probe --timeout=120s
          reach() { kubectl exec np-probe -- curl -s -o /dev/null --max-time 5 "$1"; }
          reach http://geolens-frontend.geolens/api/health/live || {
            echo "the frontend must stay reachable without networkPolicy.frontendFrom" >&2
            exit 1
          }
          worker=$(kubectl -n geolens get pod -l app.kubernetes.io/component=worker \
            -o jsonpath='{.items[0].status.podIP}')
          for url in http://geolens-api.geolens:8000/health/live \
                     http://geolens-titiler.geolens:8000/healthz \
                     "http://$worker:8001/health/live"; do
            if reach "$url"; then
              echo "$url answered a pod outside the release; the NetworkPolicy is not enforced" >&2
              exit 1
            fi
          done
          echo "frontend open; api, titiler and worker refuse other pods"

      - name: helm upgrade idempotence (migrate hook re-run)
        run: |
          helm upgrade geolens helm/geolens --namespace geolens --reuse-values --wait --timeout 10m

      - name: Retire the fresh install
        # The upgrade scenario below gets the runner to itself.
        run: |
          pkill -f 'kubectl.*port-forward' || true
          helm uninstall geolens --namespace geolens --wait
          kubectl delete namespace geolens --wait

      - name: Upgrade from the latest published chart
        # A separate stack in its own namespace and database, so a chart whose
        # appVersion is ahead of the published one never runs the older app
        # against a newer schema. Installs what an operator runs today, ingests
        # through the edge, upgrades to this tree's chart and checks the data
        # survived. --reset-then-reuse-values takes this chart's defaults, image
        # tags included, and keeps the install's values: the upgrade an operator
        # who passes the same values file gets. The job's --reuse-values re-run
        # above covers the other way of upgrading.
        run: |
          # 10-init.sql errors on the reader role the new database inherits
          # from the cluster; psql carries on past it.
          kubectl exec deploy/geolens-ci-db -- psql -U geolens -d postgres -c 'CREATE DATABASE geolens_upgrade OWNER geolens'
          kubectl exec deploy/geolens-ci-db -- psql -U geolens -d geolens_upgrade -f /docker-entrypoint-initdb.d/10-init.sql
          kubectl create namespace geolens-upgrade
          kubectl label namespace geolens-upgrade pod-security.kubernetes.io/enforce=restricted
          values=(
            --set api.replicas=1
            --set frontend.replicas=1
            --set secrets.databaseUrlOverride='postgresql+asyncpg://geolens:chart-ci-db-password@geolens-ci-db.default.svc.cluster.local:5432/geolens_upgrade'
            --set secrets.jwtSecretKey='0123456789abcdef0123456789abcdef'
            --set secrets.adminUsername='ci-admin'
            --set secrets.adminPassword='chart-ci-only-Passw0rd!'
            --set networkPolicy.enabled=true
            --set staging.persistence.enabled=true
            --set-json 'staging.persistence.accessModes=["ReadWriteOnce"]'
            --set staging.persistence.storageClass=standard
          )
          helm install geolens oci://ghcr.io/geolens-io/charts/geolens --namespace geolens-upgrade \
            "${values[@]}" --wait --timeout 20m
          helm list --namespace geolens-upgrade

          # A fresh log per session, and wait for the old forward to exit before
          # the next one binds 8081.
          forward() {
            log=$(mktemp)
            kubectl -n geolens-upgrade port-forward svc/geolens-frontend 8081:80 > "$log" 2>&1 &
            pf=$!
            for _ in $(seq 1 20); do grep -q Forwarding "$log" && break; sleep 1; done
          }
          unforward() { kill "$pf"; wait "$pf" 2>/dev/null || true; }
          smoke() {
            forward
            .github/ci/ingest-smoke.sh http://127.0.0.1:8081 ci-admin 'chart-ci-only-Passw0rd!' | tee "$1"
            unforward
          }
          smoke "$RUNNER_TEMP/before-upgrade.log"

          helm upgrade geolens helm/geolens --namespace geolens-upgrade --reset-then-reuse-values --wait --timeout 20m
          helm list --namespace geolens-upgrade

          smoke "$RUNNER_TEMP/after-upgrade.log"
          forward
          token=$(curl -sSf -X POST http://127.0.0.1:8081/api/auth/login \
            --data-urlencode username=ci-admin --data-urlencode 'password=chart-ci-only-Passw0rd!' \
            | jq -r .access_token)
          listed=$(curl -sSf -H "Authorization: Bearer $token" http://127.0.0.1:8081/api/datasets/ | jq -r '.datasets[].id')
          unforward
          for kind in vector raster; do
            id=$(sed -n "s/^$kind dataset \(.*\) ingested$/\1/p" "$RUNNER_TEMP/before-upgrade.log")
            if [ -z "$id" ] || ! grep -qx "$id" <<<"$listed"; then
              echo "the $kind dataset ingested before the upgrade (${id:-none recorded}) is gone after it" >&2
              exit 1
            fi
          done
          echo "datasets ingested before the upgrade still list after it"

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl get events -A --sort-by=.lastTimestamp | tail -50
          for ns in geolens geolens-upgrade; do
            kubectl -n "$ns" describe pods -l app.kubernetes.io/instance=geolens || true
            for c in $(kubectl -n "$ns" get pods -l app.kubernetes.io/instance=geolens -o name); do
              echo "=== logs $ns/$c ==="
              kubectl -n "$ns" logs "$c" --all-containers --tail=100 || true
            done
          done
          kubectl logs -l app=geolens-ci-db --tail=50 || true

  terraform-validate:
    name: terraform validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Guard - every chart upgrade note reaches the recipes and cloud guides
        run: bash .github/ci/upgrade-note-parity.sh

      - name: Guard - the leftover sweeps flag only what the stack owns, and stop on a failed call
        run: bash .github/ci/test-sweeps.sh

      - name: terraform fmt
        run: terraform fmt -check -recursive terraform

      # Every recipe in this one job: main requires the check by its name.
      - name: terraform validate
        run: |
          for dir in terraform/*/; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
          bash terraform/aws-ecs-fargate/test-production-profile.sh
          bash terraform/azure-container-apps/test-validations.sh
