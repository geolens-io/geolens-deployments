{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "geolens.fullname" . }}-migrate
  labels:
    {{- include "geolens.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Run before install/upgrade so pods only ever start against a migrated
    # schema. Job specs are immutable — without the delete policy every image
    # bump would fail `helm upgrade` with a "field is immutable" error.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "geolens.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      {{- /* No serviceAccountName: this hook runs before a chart-created account exists,
           and a missing account creates no pod, so a fresh install would hang. The
           namespace default suffices: migrations reach only the database. */}}
      restartPolicy: OnFailure
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* The api's node placement, so a tainted pool does not strand the hook,
           but not its pod affinity or spread, which name api pods that a
           pre-install hook runs before. */}}
      {{- $apiNodeAffinity := pick (.Values.api.affinity | default dict) "nodeAffinity" }}
      {{- with include "geolens.scheduling" (dict "nodeSelector" .Values.api.nodeSelector "tolerations" .Values.api.tolerations "affinity" $apiNodeAffinity) | trim }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- /* Only the extraVolumes this Job mounts. Any other can wedge the hook (an RWO
           claim attached on another node, a Secret not created yet), and a
           pre-install hook that never completes fails the install. */}}
      {{- $mountNames := list }}
      {{- range (.Values.migrate.extraVolumeMounts | default list) }}
      {{- $mountNames = append $mountNames .name }}
      {{- end }}
      {{- $volumes := list }}
      {{- range (.Values.extraVolumes | default list) }}
      {{- if has .name $mountNames }}
      {{- $volumes = append $volumes . }}
      {{- end }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- include "geolens.containerSecurityContext" . | nindent 12 }}
          # `upgrade heads` (plural) matches the api entrypoint and stays
          # correct should the migration graph ever carry multiple heads.
          command:
            - sh
            - -c
            - uv run --no-dev alembic upgrade heads
          {{- if .Values.secrets.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.existingSecret }}
          {{- end }}
          {{- if or (not .Values.secrets.existingSecret) .Values.api.extraEnv .Values.migrate.extraEnv (.Values.database | default dict).sslMode }}
          env:
            {{- /* Names the operator sets in either list. A generated entry below is
                 skipped when it collides, as in the titiler template, so the value
                 the operator can see is the one that applies. */}}
            {{- $overrideNames := list }}
            {{- range (.Values.api.extraEnv | default list) }}
            {{- $overrideNames = append $overrideNames .name }}
            {{- end }}
            {{- range (.Values.migrate.extraEnv | default list) }}
            {{- $overrideNames = append $overrideNames .name }}
            {{- end }}
            {{- if not (has "DATABASE_SSL_MODE" $overrideNames) }}
            {{- with (.Values.database | default dict).sslMode }}
            # Inlined: this hook runs before the -config ConfigMap exists. Without
            # it the migration would use the application's default TLS mode while
            # the api and worker use the configured one.
            - name: DATABASE_SSL_MODE
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if not .Values.secrets.existingSecret }}
            # Inlined rather than referencing the chart-managed Secret: as a
            # pre-install hook this Job runs before regular resources exist,
            # so a secretRef would deadlock a fresh install.
            - name: DATABASE_URL_OVERRIDE
              value: {{ required "secrets.databaseUrlOverride is required (or provide secrets.existingSecret)" .Values.secrets.databaseUrlOverride | quote }}
            - name: JWT_SECRET_KEY
              value: {{ required "secrets.jwtSecretKey is required — generate with `openssl rand -hex 32` (or provide secrets.existingSecret)" .Values.secrets.jwtSecretKey | quote }}
            - name: GEOLENS_ADMIN_USERNAME
              value: {{ required "secrets.adminUsername is required (or provide secrets.existingSecret)" .Values.secrets.adminUsername | quote }}
            - name: GEOLENS_ADMIN_PASSWORD
              value: {{ required "secrets.adminPassword is required (or provide secrets.existingSecret)" .Values.secrets.adminPassword | quote }}
            # Required at settings construction even though the override DSN
            # carries the real credentials (see secret.yaml).
            - name: POSTGRES_PASSWORD
              value: "unused-database-url-override-in-use"
            {{- /* The same checks as secret.yaml; each entry is skipped when extraEnv
                 already carries the name. */}}
            {{- include "geolens.validateEncryptionKeys" . }}
            {{- if not (has "SECRET_ENCRYPTION_KEY" $overrideNames) }}
            {{- with .Values.secrets.secretEncryptionKey }}
            - name: SECRET_ENCRYPTION_KEY
              value: {{ . | toString | quote }}
            {{- end }}
            {{- end }}
            {{- if not (has "SECRET_ENCRYPTION_KEY_PREVIOUS" $overrideNames) }}
            {{- with .Values.secrets.secretEncryptionKeyPrevious }}
            - name: SECRET_ENCRYPTION_KEY_PREVIOUS
              value: {{ . | toString | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- /* Both api.extraEnv and migrate.extraEnv render here, and a name in both
                 would repeat in one container, which strategic-merge tooling rejects
                 before a pod rolls. The migrate entry wins; the api one is dropped. */}}
            {{- $migrateNames := list }}
            {{- range (.Values.migrate.extraEnv | default list) }}
            {{- $migrateNames = append $migrateNames .name }}
            {{- end }}
            {{- range (.Values.api.extraEnv | default list) }}
            {{- if not (has .name $migrateNames) }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
            {{- end }}
            {{- with .Values.migrate.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          volumeMounts:
            {{- include "geolens.backendScratch" (list (.Values.migrate | default dict).extraVolumeMounts $volumes "mounts") | trim | nindent 12 }}
            {{- with (.Values.migrate | default dict).extraVolumeMounts }}
            # The same database as the api needs the same mounts, most often a CA
            # bundle for DATABASE_SSL_MODE=verify-full. Without them the
            # pre-upgrade hook fails before any api pod rolls.
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- include "geolens.backendScratch" (list (.Values.migrate | default dict).extraVolumeMounts $volumes "volumes") | trim | nindent 8 }}
        {{- with $volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
