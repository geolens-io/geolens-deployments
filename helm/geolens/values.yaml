nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

# ServiceAccount for the api, worker and titiler pods. Its reason to exist is
# cloud credentials: annotate it and the platform injects credentials the
# AWS/Azure SDKs resolve on their own, so no long-lived key ever lands in a
# Secret.
#
# `create: false` is the default deliberately. Every release before this value
# existed ran under the namespace's `default` ServiceAccount, and switching an
# existing install to a fresh one on an ordinary upgrade would silently drop
# whatever that account carries — imagePullSecrets, RBAC bindings, its own
# workload-identity annotations — which surfaces as ImagePullBackOff or lost
# access rather than as anything pointing back at this value. Opting in is the
# safe direction; being opted in by an upgrade is not.
#
# On EKS (IRSA), create one and annotate it, alongside
# storage.s3AmbientCredentials=true:
#
#   serviceAccount:
#     create: true
#     annotations:
#       eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/geolens-s3
#
# EKS Pod Identity needs no annotation at all — associate the role with this
# ServiceAccount name instead. To adopt a ServiceAccount you manage yourself
# (eksctl, Terraform), keep `create: false` and set `name`.
serviceAccount:
  create: false
  # With create: true, defaults to the release fullname when empty.
  # With create: false, empty means the namespace's `default` account.
  name: ""
  annotations: {}

# Deployment security posture, passed to the backend as ENVIRONMENT (SEC-005).
# "production" hides /docs and /redoc and marks the OAuth session cookie
# Secure. Set "development" only on throwaway clusters.
environment: "production"

# Cluster DNS domain, used to build the fully qualified api Service name the
# frontend nginx proxies to (its resolver ignores search domains, so short
# names would not resolve). Change only on clusters with a custom domain.
clusterDomain: cluster.local

api:
  replicas: 2
  image:
    repository: ghcr.io/geolens-io/geolens-api
    tag: "1.20.0"
    pullPolicy: IfNotPresent
  publicAppUrl: "https://geolens.example.com"
  publicApiUrl: "https://geolens.example.com/api"
  corsAllowedOrigins: ""
  # Backend upload limit. The frontend edge nginx is kept in step with this
  # automatically: the chart renders CLIENT_MAX_BODY_SIZE as "<value>m" on the
  # frontend (geolens#580, shipped in 1.4.10), so raising it no longer 413s at
  # the edge. Frontend images < 1.4.10 ignore that variable and stay at 500m.
  uploadMaxSizeMb: "500"
  resources: {}
  # The chart sets FORWARDED_ALLOW_IPS="*" on the api so uvicorn takes the
  # client address from the X-Forwarded-For the frontend edge writes. Without
  # it every user shares the frontend pod's rate-limit buckets (login allows 5
  # attempts a minute per client). Any pod that can reach the api Service can
  # set that header too; if untrusted workloads share the cluster, narrow it to
  # your pod CIDR here, e.g. [{name: FORWARDED_ALLOW_IPS, value: 10.42.0.0/16}].
  extraEnv: []
  extraVolumeMounts: []
  # Placement for the api pods. The migrate hook Job takes the node-level part
  # (nodeSelector, tolerations, affinity.nodeAffinity), so a toleration for a
  # dedicated node pool reaches the hook too; without it the hook stays Pending
  # and the install or upgrade times out. Pod affinity and spread constraints
  # stay api-only: they select api pods, which a pre-install hook runs before.
  # Spread constraints need their own labelSelector, e.g.
  #   topologySpreadConstraints:
  #     - maxSkew: 1
  #       topologyKey: kubernetes.io/hostname
  #       whenUnsatisfiable: ScheduleAnyway
  #       labelSelector:
  #         matchLabels:
  #           app.kubernetes.io/instance: geolens
  #           app.kubernetes.io/component: api
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

worker:
  replicas: 1
  image:
    repository: ghcr.io/geolens-io/geolens-worker
    tag: "1.20.0"
    pullPolicy: IfNotPresent
  resources: {}
  # Seconds between SIGTERM and SIGKILL. Keep it above WORKER_SHUTDOWN_TIMEOUT
  # (default 30), the window the worker gives running jobs to finish, so it can
  # release them before it is killed. Compose uses the same 35s. Raise both
  # together.
  terminationGracePeriodSeconds: 35
  extraEnv: []
  extraVolumeMounts: []
  # Placement, as for api.nodeSelector and friends. Large raster ingests are
  # the most memory-hungry work in the stack, so this is the pod most worth
  # pinning to bigger nodes.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

frontend:
  replicas: 2
  image:
    repository: ghcr.io/geolens-io/geolens-frontend
    # Must stay >= 1.4.9: older frontend images predate the parameterized
    # edge proxy (API_UPSTREAM) and cannot reach the api on Kubernetes.
    tag: "1.20.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  # Browser-facing base URLs injected into the SPA at container start
  # (window.__ENV__). Empty means same-origin relative URLs — correct whenever
  # the app is reached through this chart's ingress. Set tileBaseUrl only when
  # serving tiles through a separate CDN hostname.
  apiBaseUrl: ""
  tileBaseUrl: ""
  # CIDRs of the proxies in front of this chart's frontend — typically the
  # ingress controller's pod network, plus any CDN edge ranges ahead of it
  # (geolens#581, frontend images >= 1.4.10).
  #
  # Empty keeps the anti-spoofing overwrite: nginx trusts nobody and every
  # request is attributed to the immediate peer, so the anonymous raster rate
  # limit shares ONE bucket across all users and access logs show the
  # controller's IP instead of the client's.
  #
  # nginx walks X-Forwarded-For right-to-left skipping trusted entries, so
  # EVERY hop must be listed or resolution stops early — listing only a CDN
  # while an ingress controller sits in between resolves to the CDN edge, not
  # the client. Untrusted client-supplied entries are never reached, so a
  # spoofed header cannot win. Entries are charset-validated at container
  # start; a malformed value fails fast rather than injecting nginx config.
  #
  # e.g. ["10.42.0.0/16"] or ["10.42.0.0/16", "173.245.48.0/20"]
  trustedProxyCidrs: []
  # The image runs nginx as uid 101; stating it lets Kubernetes enforce
  # runAsNonRoot (it cannot verify the image's non-numeric USER). On platforms
  # that assign UIDs themselves, such as OpenShift, set runAsUser and runAsGroup
  # to null. An empty map does not clear these: Helm merges it with the
  # defaults, and the template falls back to them when the key is absent.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
  resources: {}
  extraEnv: []
  # Placement, as for api.nodeSelector and friends.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

titiler:
  # Raster (COG) tile rendering, part of the standard GeoLens topology.
  # Disable only for vector-only catalogs — raster datasets need it.
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/developmentseed/titiler
    # geolens#1190: upstream ships security fixes as ordinary bugfix releases
    # with no advisory, and OSV carries nothing for rio-tiler or titiler.core,
    # so Dependabot cannot see this drift — bumps here are deliberate.
    # 2.2.1 resolves rio-tiler 9.4.2, but rasterio stays 1.5.0 / GDAL 3.12.1
    # (the PyPI wheel pins GDAL, not the titiler tag).
    tag: "2.2.1"
    pullPolicy: IfNotPresent
  # geolens#1193: uvicorn worker processes per titiler pod. Tile rendering is
  # CPU-bound under the GIL, so one worker renders one tile at a time and
  # concurrent cache misses queue. On Kubernetes prefer `replicas` above for
  # scale-out; this knob exists for parity with the compose TITILER_WORKERS
  # default and for nodes where one fat pod beats several thin ones.
  #
  # Raise the memory limit in `resources` with it. GDAL_CACHEMAX is per
  # PROCESS, so N workers multiply the block-cache ceiling on top of N Python
  # interpreters, and the geolens#678 RSS ratchet runs in every one of them —
  # raising workers under an unchanged limit reaches OOMKill sooner, not later.
  workers: 1
  # The upstream titiler image declares no USER, so without this it runs as
  # root. uid 1001 is the backend images' user: titiler can then read the
  # rasters the api writes to a shared staging claim. On platforms that assign
  # UIDs themselves, such as OpenShift, set runAsUser and runAsGroup to null
  # (an empty map does not clear them; see frontend.podSecurityContext).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
  # Empty = BestEffort QoS: titiler is evicted first under node pressure and
  # its RSS ratchet (geolens#678) grows unbounded. For production, set a
  # memory limit of roughly 2x the plateau you observe (the demo plateaus
  # around 600Mi-1.8Gi depending on raster traffic) — under a limit, an
  # OOMKill restart is the intended recycling backstop, gated by the probes
  # below. Requests are also the prerequisite for ever running an HPA.
  #   resources:
  #     requests: {memory: 256Mi, cpu: 100m}
  #     limits: {memory: 2Gi}
  resources: {}
  # glibc malloc arena cap inside the titiler container (geolens#678). Slows
  # (does not stop) TiTiler's RSS ratchet under concurrent tile reads; raise
  # only if malloc contention shows up on many-core nodes. Mirrors the compose
  # TITILER_MALLOC_ARENA_MAX knob.
  mallocArenaMax: 2
  # TiTiler only reads managed raster objects. For least privilege, point this
  # at a pre-created Secret whose principal can GetObject only under rasters/*
  # and tenants/*/rasters/*. The empty existingSecret and default key names are
  # an upgrade-compatibility fallback: they select the chart's shared storage
  # Secret and its S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY keys, exactly as
  # chart versions before 0.4.17 did. See the README's storage section.
  s3Credentials:
    existingSecret: ""
    accessKeyIdKey: "S3_ACCESS_KEY_ID"
    secretAccessKeyKey: "S3_SECRET_ACCESS_KEY"
  # With storage.backend=s3 on a non-AWS endpoint (MinIO/R2), raster assets
  # resolve as /vsis3/ paths and GDAL needs to be told about the endpoint.
  # The chart now derives AWS_S3_ENDPOINT / AWS_HTTPS / AWS_VIRTUAL_HOSTING
  # from the storage.* values at template time, mirroring the rules the api
  # and worker apply to themselves at boot (geolens#579, derive_gdal_s3_env).
  # titiler is a separate process tree that runs no GeoLens code, so template
  # time is the only place this can happen for it.
  #
  # Anything set here still wins: extraEnv is emitted after the derived block.
  extraEnv: []
  # Placement, as for api.nodeSelector and friends.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

migrate:
  # Run Alembic migrations as a pre-install/pre-upgrade hook Job, before any
  # new pods roll. When disabled, every api pod runs migrations at boot
  # instead, which races with api.replicas > 1 — keep this enabled.
  enabled: true
  backoffLimit: 2
  extraEnv: []
  # Mounts from `extraVolumes` for the migrate Job. It talks to the same
  # database as the api, so a CA bundle needed for DATABASE_SSL_MODE=verify-full
  # has to reach this pod as well — it runs as a pre-install/pre-upgrade hook,
  # before the api rolls, so a missing mount fails the whole upgrade here.
  extraVolumeMounts: []

service:
  api:
    type: ClusterIP
    port: 8000

ingress:
  # Behind an ingress controller the frontend nginx sees the controller's IP
  # as the client unless you list the controller's network in
  # frontend.trustedProxyCidrs — without it the anonymous raster rate limit
  # shares one bucket across all users and access logs lose the real client.
  # Routes ALL traffic to the frontend, whose bundled nginx is the app edge:
  # it proxies /api and raster tiles to the api service (the api serves its
  # routes un-prefixed, nginx strips /api), blocks the unauthenticated
  # /api/metrics endpoint, rate-limits anonymous raster traffic, and redacts
  # credentialed paths from access logs. Do not add ingress paths that bypass
  # it.
  enabled: false
  className: ""
  annotations: {}
  host: geolens.example.com
  tls: []

database:
  # TLS mode for the external database: "" | disable | prefer | require |
  # verify-full. Empty leaves the application default, which is `prefer` —
  # encryption is used when the server offers it and SILENTLY SKIPPED when it
  # does not.
  #
  # An `?sslmode=` parameter written into secrets.databaseUrlOverride does NOT
  # do this job. The backend strips it before handing the DSN to asyncpg (which
  # has no such parameter) and derives TLS from this setting alone, so a DSN
  # reading `...?sslmode=require` connects under `prefer`. Measured against
  # RDS: the DSN said require, the client offered no encryption, and only the
  # server's own rds.force_ssl=1 refused it.
  #
  # Set here rather than through extraEnv so api, worker AND the migrate hook
  # agree — the migrate Job cannot read the chart's ConfigMap (it is a
  # pre-install hook, ordered before regular resources), so an extraEnv on the
  # api alone leaves migrations on the default.
  #
  # verify-full additionally needs the provider's CA bundle, which the backend
  # requires as a FILE (DATABASE_SSL_CA_CERT). Create a ConfigMap holding the
  # PEM yourself, then reference it from extraVolumes plus the api/worker/migrate
  # extraVolumeMounts, and point DATABASE_SSL_CA_CERT at the mount path. See
  # the README's external-database section.
  sslMode: ""

secrets:
  # Name of a pre-created Secret to use instead of the chart-managed one.
  # It must carry the required keys listed in the README (DATABASE_URL_OVERRIDE,
  # JWT_SECRET_KEY, GEOLENS_ADMIN_USERNAME, GEOLENS_ADMIN_PASSWORD, plus any
  # optional ones you use).
  existingSecret: ""
  # SQLAlchemy async DSN for the operator-managed PostgreSQL, e.g.
  # postgresql+asyncpg://geolens:secret@db.example.internal:5432/geolens
  databaseUrlOverride: ""
  # JWT signing secret. MUST be at least 32 characters.
  # Generate with: openssl rand -hex 32
  # Maps to JWT_SECRET_KEY env var (matches Pydantic Settings field).
  jwtSecretKey: ""
  # Initial admin credentials. The backend REQUIRES these at boot (there is no
  # default) and refuses known-public example passwords.
  adminUsername: ""
  adminPassword: ""
  tileSigningSecret: ""
  openaiApiKey: ""
  anthropicApiKey: ""
  # Dedicated key for the secrets GeoLens stores (connector credentials and
  # the like), decoupled from JWT_SECRET_KEY (#39, geolens#1882, app images
  # >= 1.18.2; the chart refuses to render it against an older api tag,
  # where it would be silently ignored). Empty derives the key from
  # JWT_SECRET_KEY as before. Generate with:
  #   openssl rand -base64 32 | tr '+/' '-_'
  secretEncryptionKey: ""
  # The previous key, kept readable while rotating to a new one. Set it only
  # alongside a new secretEncryptionKey, run backend/scripts/rotate_secrets.py
  # in an api pod, then clear it and roll the pods. The backend refuses to
  # boot with the previous key set and the current one empty, and so does
  # this chart. Runbook: GeoLens RUNBOOK.md section 11, Secret rotation.
  secretEncryptionKeyPrevious: ""

redis:
  # Optional Redis-compatible tile/query cache (the compose stack ships
  # Valkey). Empty disables caching.
  url: ""

storage:
  # Object storage for rasters, exports, and processed artifacts. On
  # Kubernetes use "s3" (or "azure" via extraEnv). "local" writes into the
  # staging volume: without staging.persistence that is a per-pod emptyDir,
  # so stored data is LOST on pod restart and diverges across replicas.
  backend: "local"
  s3Endpoint: ""
  s3Region: ""
  s3Bucket: ""
  s3AccessKeyId: ""
  s3SecretAccessKey: ""
  # Resolve S3 credentials from the runtime instead of a static key pair:
  # EKS IRSA / Pod Identity, or any environment that supplies the AWS
  # container-credential or web-identity variables. Requires app images
  # >= 1.14.2 — older backends refuse to boot with STORAGE_PROVIDER=s3 and no
  # S3_ACCESS_KEY_ID, whatever the runtime offers.
  #
  # With this on, s3AccessKeyId/s3SecretAccessKey stop being required, and when
  # left empty nothing is written to the Secret and titiler's
  # AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY are left unset, so both process
  # trees resolve the role instead. Keys set anyway are still passed through
  # and still win — that is boto3's and GDAL's own precedence, not something
  # the chart can reorder. Pair it with an annotated
  # serviceAccount (above) — the chart cannot verify a role is actually
  # attached, so a missing annotation surfaces as AccessDenied at first use.
  s3AmbientCredentials: false
  # Reach a scheme-less s3Endpoint over http instead of https. Mirrors the
  # backend's S3_ALLOW_HTTP; an explicit scheme on s3Endpoint always wins.
  s3AllowHttp: false
  # "auto" | "path" | "virtual". MinIO generally wants "path". Mirrors the
  # backend's S3_ADDRESSING_STYLE. Both keys are passed to the api/worker AND
  # used to derive titiler's GDAL env, so the two cannot drift apart — the
  # divergence class geolens#579 fixed.
  s3AddressingStyle: "auto"

staging:
  # /app/staging is scratch space (GAP-022 in the main repo's
  # docker-compose.yml): the api writes uploads there, the worker reads them
  # for ingest, and titiler reads rasters under it — all at the same fixed
  # path. Whether it must be SHARED depends on storage.backend:
  #
  #   s3    — no. An upload is written to the bucket under a relative key and
  #           the worker fetches it from there, so the handoff never crosses a
  #           filesystem. Measured across pods with no shared volume at all.
  #   local — yes. The only copy lives in one pod's emptyDir, so the worker
  #           cannot read it and stored artifacts are lost on pod restart.
  #
  # On EKS the defaults below cannot bind: ReadWriteMany is rejected by the EBS
  # CSI driver, and an empty storageClass needs a cluster DEFAULT StorageClass
  # that eksctl does not mark. RWX on AWS means EFS.
  persistence:
    enabled: false
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteMany
    size: 20Gi

# Containers run with a read-only root filesystem, as compose runs these images.
# The api, worker and migrate hook get emptyDirs at /tmp and /home/appuser, the
# frontend at /tmp and /var/cache/nginx (its raster tile cache), and titiler at
# /tmp; that is everything they write outside /app/staging. Set false only if
# something you add writes elsewhere. Titiler keeps its read-only root either
# way.
readOnlyRootFilesystem: true

# PodDisruptionBudgets for the api, frontend and titiler, so a node drain evicts
# one pod of each at a time. maxUnavailable rather than minAvailable: with a
# single replica the pod can still be evicted, where minAvailable: 1 would
# block the drain forever.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# NetworkPolicies, off by default because they only work with a CNI that
# enforces them and the frontend's rule depends on where your ingress
# controller runs. When enabled, only this release's frontend reaches the api
# (so nothing can route around the edge or feed the api a forged
# X-Forwarded-For), only the api reaches titiler, and nothing reaches the
# worker. Kubelet probes are unaffected. Egress is left open: the database,
# bucket and cache live wherever you put them.
networkPolicy:
  enabled: false
  # Peers allowed to scrape /metrics on the api and worker, e.g.
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: monitoring
  # The api serves /metrics on its only port and a NetworkPolicy cannot filter
  # paths, so these peers reach every api route, skipping the edge's rate
  # limits and log redaction, and can send a forged X-Forwarded-For. List only
  # peers you would trust as API clients.
  metricsFrom: []
  # Peers allowed to reach the frontend, typically the ingress controller's
  # namespace. Empty leaves the frontend open to the whole cluster.
  frontendFrom: []

# Applied to api, worker, and migrate pods (uid 1001 matches the appuser baked
# into the backend images). The frontend and titiler have their own
# podSecurityContext above. Every container also drops all capabilities, runs
# without privilege escalation, and uses the RuntimeDefault seccomp profile,
# which together meet the Pod Security "restricted" standard.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

# Volumes for the api, worker and migrate pods to mount through their
# extraVolumeMounts. The chart already uses the names staging, geolens-tmp and
# geolens-home in those pods; pick others. A component's own mount at /tmp or
# /home/appuser replaces the chart's emptyDir there.
extraVolumes: []
