{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "geolens.fullname" . }}
  labels:
    {{- include "geolens.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Everything flows through the frontend's edge nginx: it proxies
          # /api and raster tiles to the api service (stripping the /api
          # prefix the backend does not serve), 404s the unauthenticated
          # /api/metrics endpoint, rate-limits anonymous raster traffic, and
          # redacts credentialed paths from access logs. Adding a direct-to-api
          # path here would bypass all of that.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "geolens.fullname" . }}-frontend
                port:
                  name: http
{{- end }}
