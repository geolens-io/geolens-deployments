apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "geolens.fullname" . }}-frontend
  labels:
    {{- include "geolens.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "geolens.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "geolens.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- /*
              Every key below is skipped when already present in
              frontend.extraEnv (fix(#16 review) widened this from the two
              derived keys to the statics too): repeating an env name survives
              the container runtime but breaks strategic-merge tooling, which
              keys `env` by `name`, so a Helm/Argo upgrade can fail on the
              duplicate merge key. Operators who set a variable by hand before
              the chart wired it must still be able to upgrade.
            */}}
            {{- $feExtraNames := list }}
            {{- range (.Values.frontend.extraEnv | default list) }}
            {{- $feExtraNames = append $feExtraNames .name }}
            {{- end }}
            # nginx proxy target for the /api, raster-tile, and embed
            # frame-policy blocks (frontend images >= 1.4.9; older images
            # ignore this and can only proxy under compose).
            {{- if not (has "API_UPSTREAM" $feExtraNames) }}
            - name: API_UPSTREAM
              value: {{ include "geolens.apiUrl" . | quote }}
            {{- end }}
            # Rendered into the SPA's window.__ENV__ at container start.
            # Empty values mean same-origin relative URLs.
            {{- if not (has "API_BASE_URL" $feExtraNames) }}
            - name: API_BASE_URL
              value: {{ .Values.frontend.apiBaseUrl | quote }}
            {{- end }}
            {{- if not (has "TILE_BASE_URL" $feExtraNames) }}
            - name: TILE_BASE_URL
              value: {{ .Values.frontend.tileBaseUrl | quote }}
            {{- end }}
            # Absolutizes the og:image meta tag for social scrapers.
            {{- if not (has "PUBLIC_APP_URL" $feExtraNames) }}
            - name: PUBLIC_APP_URL
              value: {{ .Values.api.publicAppUrl | quote }}
            {{- end }}
            {{- if not (has "CLIENT_MAX_BODY_SIZE" $feExtraNames) }}
            # Keep the edge upload ceiling in step with the backend's limit so
            # a raised api.uploadMaxSizeMb is not 413'd by nginx (geolens#580,
            # frontend images >= 1.4.10). The entrypoint validates the value.
            - name: CLIENT_MAX_BODY_SIZE
              value: {{ printf "%sm" (toString .Values.api.uploadMaxSizeMb) | quote }}
            {{- end }}
            {{- if and .Values.frontend.trustedProxyCidrs (not (has "TRUSTED_PROXY_CIDRS" $feExtraNames)) }}
            # Recover the real client address from X-Forwarded-For for exactly
            # these hops (geolens#581). Comma-joined; the entrypoint rejects
            # anything outside IP/CIDR characters.
            - name: TRUSTED_PROXY_CIDRS
              value: {{ join "," .Values.frontend.trustedProxyCidrs | quote }}
            {{- end }}
            {{- with .Values.frontend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
