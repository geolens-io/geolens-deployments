{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "geolens.fullname" . }}
  labels:
    {{- include "geolens.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Everything goes through the frontend's edge nginx, which strips the /api
          # prefix, 404s /api/metrics, rate-limits anonymous raster traffic and redacts
          # credentialed paths from logs. A direct-to-api path would bypass all of it.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "geolens.fullname" . }}-frontend
                port:
                  name: http
{{- end }}
