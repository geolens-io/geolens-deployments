name: chart-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: helm lint
        # Lint mode does not enforce `required` (this step passed with empty
        # values), but linting with the same values as the template matrix
        # keeps it representative of a real install.
        run: |
          helm lint helm/geolens \
            --set secrets.databaseUrlOverride='postgresql+asyncpg://geolens:pw@db.internal:5432/geolens' \
            --set secrets.jwtSecretKey='0123456789abcdef0123456789abcdef' \
            --set secrets.adminUsername='admin' \
            --set secrets.adminPassword='chart-ci-only-Passw0rd!'

      - name: Template — default configuration
        run: |
          helm template geolens helm/geolens \
            --set secrets.databaseUrlOverride='postgresql+asyncpg://geolens:pw@db.internal:5432/geolens' \
            --set secrets.jwtSecretKey='0123456789abcdef0123456789abcdef' \
            --set secrets.adminUsername='admin' \
            --set secrets.adminPassword='chart-ci-only-Passw0rd!' \
            > /dev/null

      - name: Template — existingSecret + ingress + staging persistence
        run: |
          helm template geolens helm/geolens \
            --set secrets.existingSecret=geolens-secrets \
            --set ingress.enabled=true \
            --set staging.persistence.enabled=true \
            > /dev/null

      - name: Template — titiler disabled, s3 storage
        run: |
          helm template geolens helm/geolens \
            --set secrets.existingSecret=geolens-secrets \
            --set titiler.enabled=false \
            --set storage.backend=s3 \
            --set storage.s3Bucket=geolens \
            > /dev/null

      - name: Guard - no no-op GDAL_HTTP_FOLLOWLOCATION in rendered output
        # geolens#937: the variable is not a GDAL option and does nothing, so
        # setting it reads as a redirect defense that is not there. The main
        # repo removed it and pins that in backend/tests/test_titiler_redirect_env.py;
        # this is the chart-side equivalent so the two cannot drift apart again.
        run: |
          if helm template geolens helm/geolens \
            --set secrets.existingSecret=geolens-secrets \
            | grep -q 'name: GDAL_HTTP_FOLLOWLOCATION'; then
            echo "GDAL_HTTP_FOLLOWLOCATION is not a GDAL option and provides no redirect protection (geolens#937); remove it" >&2
            exit 1
          fi

      - name: Required-value guards fail an empty install
        run: |
          if helm template geolens helm/geolens > /dev/null 2>&1; then
            echo "expected 'required' failure when no secrets are provided" >&2
            exit 1
          fi

  # Real install against a kind cluster: exercises the install-time failure
  # classes static rendering provably cannot catch (hook ordering, Job
  # immutability on upgrade, probe budgets, FQDN proxy resolution through the
  # frontend edge). Uses the published GHCR images at the chart's default tags.
  install-test:
    name: kind install test
    runs-on: ubuntu-latest
    needs: lint-and-template
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Deploy CI PostgreSQL (PostGIS + pgvector)
        run: |
          kubectl apply -f .github/ci/postgres.yaml
          kubectl rollout status deployment/geolens-ci-db --timeout=300s

      - name: helm install --wait
        run: |
          helm install geolens helm/geolens \
            --set api.replicas=1 \
            --set frontend.replicas=1 \
            --set secrets.databaseUrlOverride='postgresql+asyncpg://geolens:chart-ci-db-password@geolens-ci-db.default.svc.cluster.local:5432/geolens' \
            --set secrets.jwtSecretKey='0123456789abcdef0123456789abcdef' \
            --set secrets.adminUsername='ci-admin' \
            --set secrets.adminPassword='chart-ci-only-Passw0rd!' \
            --wait --timeout 20m

      - name: Smoke through the frontend edge
        # Validates the whole chain the chart configures: frontend nginx ->
        # resolver -> api Service FQDN -> /api prefix strip -> backend /health.
        run: |
          kubectl run smoke --image=curlimages/curl:8.10.1 --restart=Never \
            --attach --rm --command -- \
            curl -sf --retry 5 --retry-delay 3 http://geolens-frontend/api/health

      - name: helm upgrade idempotence (migrate hook re-run)
        run: |
          helm upgrade geolens helm/geolens --reuse-values --wait --timeout 10m

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl get events --sort-by=.lastTimestamp | tail -50
          kubectl describe pods -l app.kubernetes.io/instance=geolens
          for c in $(kubectl get pods -l app.kubernetes.io/instance=geolens -o name); do
            echo "=== logs $c ==="
            kubectl logs "$c" --all-containers --tail=100 || true
          done
          kubectl logs -l app=geolens-ci-db --tail=50 || true
