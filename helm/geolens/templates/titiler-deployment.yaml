{{- if .Values.titiler.enabled }}
{{- /* titiler.s3Credentials can name a dedicated read-only Secret; without one, the
     shared GeoLens Secret's S3_* keys apply. `default dict` covers a --reuse-values
     upgrade from a release that has no such map. */}}
{{- $titilerS3Credentials := .Values.titiler.s3Credentials | default dict }}
{{- $titilerS3SecretName := get $titilerS3Credentials "existingSecret" | default (include "geolens.secretName" .) }}
{{- $titilerS3AccessKey := get $titilerS3Credentials "accessKeyIdKey" | default "S3_ACCESS_KEY_ID" }}
{{- $titilerS3SecretKey := get $titilerS3Credentials "secretAccessKeyKey" | default "S3_SECRET_ACCESS_KEY" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "geolens.fullname" . }}-titiler
  labels:
    {{- include "geolens.labels" . | nindent 4 }}
    app.kubernetes.io/component: titiler
spec:
  replicas: {{ .Values.titiler.replicas }}
  selector:
    matchLabels:
      {{- include "geolens.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: titiler
  template:
    metadata:
      labels:
        {{- include "geolens.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: titiler
      annotations:
        {{- if and (eq .Values.storage.backend "s3") (not .Values.secrets.existingSecret) (not (get $titilerS3Credentials "existingSecret")) }}
        # Rolls titiler when the chart-managed Secret rotates: its AWS_* env comes
        # from secretKeyRefs read only at container start. An operator-managed
        # Secret has no rendered content to checksum.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- /* The IRSA / Pod Identity webhook injects credentials only at admission, so a
             ServiceAccount change must roll the pods. Outside the condition above on
             purpose: an existingSecret install is the likeliest to move to a role. */}}
        checksum/serviceaccount: {{ include (print $.Template.BasePath "/serviceaccount.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "geolens.serviceAccountName" . | quote }}
      {{- /* The upstream image declares no USER, so titiler would run as root. A
           --reuse-values upgrade from a release without this value supplies none,
           so an absent key falls back to the non-root default. */}}
      {{- $titilerPsc := dict "runAsNonRoot" true "runAsUser" 1001 "runAsGroup" 1001 }}
      {{- if hasKey .Values.titiler "podSecurityContext" }}
      {{- $titilerPsc = .Values.titiler.podSecurityContext }}
      {{- end }}
      {{- with $titilerPsc }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "geolens.scheduling" .Values.titiler | trim }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: titiler
          image: "{{ .Values.titiler.image.repository }}:{{ .Values.titiler.image.tag }}"
          imagePullPolicy: {{ .Values.titiler.image.pullPolicy }}
          # The compose titiler service's hardening (cap_drop ALL, no-new-privileges,
          # read-only root with a /tmp tmpfs). GDAL scratch goes to the /tmp emptyDir;
          # everything else is /vsis3/-style virtual I/O or the staging mount.
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          command:
            - uvicorn
            - titiler.application.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --workers
            # Mirrors compose's TITILER_WORKERS. Raise titiler.resources memory with
            # it: GDAL_CACHEMAX and TiTiler's RSS ratchet are both per process.
            - {{ .Values.titiler.workers | default 1 | quote }}
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- /* Each entry below is skipped when titiler.extraEnv sets the same name. A
                 duplicate env name breaks strategic-merge tooling before a pod rolls, and
                 extraEnv, the operator's escape hatch, must not wedge its own upgrade. */}}
            {{- $extraNames := list }}
            {{- range (.Values.titiler.extraEnv | default list) }}
            {{- $extraNames = append $extraNames .name }}
            {{- end }}
            # GDAL raster I/O tuning — mirrors the titiler service in the main
            # repo's docker-compose.yml.
            {{- if not (has "GDAL_CACHEMAX" $extraNames) }}
            - name: GDAL_CACHEMAX
              value: "200"
            {{- end }}
            {{- if not (has "GDAL_DISABLE_READDIR_ON_OPEN" $extraNames) }}
            - name: GDAL_DISABLE_READDIR_ON_OPEN
              value: "EMPTY_DIR"
            {{- end }}
            {{- if not (has "CPL_VSIL_CURL_ALLOWED_EXTENSIONS" $extraNames) }}
            - name: CPL_VSIL_CURL_ALLOWED_EXTENSIONS
              value: ".tif,.tiff,.cog,.vrt"
            {{- end }}
            # Pinned, not left to version-dependent GDAL (>= 3.12) defaults, so a base-image
            # bump cannot relax them. Deny-all costs nothing: GeoLens writes SimpleSource
            # and ComplexSource VRTs, never VRTRawRasterBand.
            {{- if not (has "GDAL_VRT_ENABLE_RAWRASTERBAND" $extraNames) }}
            - name: GDAL_VRT_ENABLE_RAWRASTERBAND
              value: "NO"
            {{- end }}
            {{- if not (has "GDAL_VRT_RAWRASTERBAND_ALLOWED_SOURCE" $extraNames) }}
            - name: GDAL_VRT_RAWRASTERBAND_ALLOWED_SOURCE
              value: "SIBLING_OR_CHILD_OF_VRT_PATH"
            {{- end }}
            # CPL_VSIL_CURL_HEADER_FILE_KVP_ENABLED, which restricts /vsicurl's header_file
            # option, needs GDAL >= 3.13.2 and stays out until the image's rasterio
            # wheel bundles that.
            {{- if not (has "VSI_CACHE" $extraNames) }}
            - name: VSI_CACHE
              value: "TRUE"
            {{- end }}
            {{- if not (has "CPL_VSIL_CURL_CACHE_SIZE" $extraNames) }}
            - name: CPL_VSIL_CURL_CACHE_SIZE
              value: "16777216"
            {{- end }}
            {{- if not (has "GDAL_HTTP_MERGE_CONSECUTIVE_RANGES" $extraNames) }}
            - name: GDAL_HTTP_MERGE_CONSECUTIVE_RANGES
              value: "YES"
            {{- end }}
            # Caps glibc malloc arenas, which slows (does not stop) TiTiler's RSS
            # ratchet under concurrent tile reads. Mirrors compose's
            # TITILER_MALLOC_ARENA_MAX and its default.
            {{- if not (has "MALLOC_ARENA_MAX" $extraNames) }}
            - name: MALLOC_ARENA_MAX
              value: {{ .Values.titiler.mallocArenaMax | default 2 | quote }}
            {{- end }}
            {{- if eq .Values.storage.backend "s3" }}
            # optional: with storage.s3AmbientCredentials, or a pre-created Secret
            # without these keys, both refs resolve to nothing and GDAL uses the
            # ServiceAccount's role, as boto3 does in the api. A present key still wins.
            {{- if not (has "AWS_ACCESS_KEY_ID" $extraNames) }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  # Exactly one reference: a dedicated Secret replaces, rather
                  # than accompanies, the shared storage credential.
                  name: {{ $titilerS3SecretName | quote }}
                  key: {{ $titilerS3AccessKey | quote }}
                  optional: true
            {{- end }}
            {{- if not (has "AWS_SECRET_ACCESS_KEY" $extraNames) }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $titilerS3SecretName | quote }}
                  key: {{ $titilerS3SecretKey | quote }}
                  optional: true
            {{- end }}
            {{- if not (has "AWS_DEFAULT_REGION" $extraNames) }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.storage.s3Region | default "us-east-1" | quote }}
            {{- end }}
            {{- /* titiler runs no GeoLens code, so the rules derive_gdal_s3_env() applies in the
                 api repeat here: GDAL takes a scheme-less host[:port], AWS_HTTPS follows an
                 explicit scheme or else s3AllowHttp, and path style turns off virtual hosting. */}}
            {{- $ep := trim (.Values.storage.s3Endpoint | default "") }}
            {{- if $ep }}
            {{- $hasScheme := contains "://" $ep }}
            {{- $scheme := $hasScheme | ternary (splitList "://" $ep | first) "" }}
            {{- $host := ($hasScheme | ternary (splitList "://" $ep | last) $ep) | splitList "/" | first }}
            {{- if $host }}
            {{- if not (has "AWS_S3_ENDPOINT" $extraNames) }}
            - name: AWS_S3_ENDPOINT
              value: {{ $host | quote }}
            {{- end }}
            {{- if and ($hasScheme | ternary (eq $scheme "http") .Values.storage.s3AllowHttp) (not (has "AWS_HTTPS" $extraNames)) }}
            - name: AWS_HTTPS
              value: "NO"
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if and (eq .Values.storage.s3AddressingStyle "path") (not (has "AWS_VIRTUAL_HOSTING" $extraNames)) }}
            - name: AWS_VIRTUAL_HOSTING
              value: "FALSE"
            {{- end }}
            {{- end }}
            {{- with .Values.titiler.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            # titiler reads rasters under the shared staging path.
            - name: staging
              mountPath: /app/staging
            # Writable scratch for GDAL under the read-only rootfs; size
            # mirrors the compose tmpfs (/tmp:size=128m).
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.titiler.resources | nindent 12 }}
      volumes:
        {{- include "geolens.stagingVolume" . | nindent 8 }}
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
{{- end }}
